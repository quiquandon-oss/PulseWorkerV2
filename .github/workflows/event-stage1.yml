# Controlled production test, Stage 1 (owner-authorised). Runs ONLY on a push to this branch; the step named in
# .stage1-step selects exactly one action. Worker code deployed = the reviewed PR #94 head in CODE_SHA (this branch adds only this
# workflow and .stage1-step). No secret value is ever printed; EVENT_RUN_TOKEN comes from the repository secret and is only masked in logs.
# 2026-10-18: predeploy gate re-run after EVENT_RUN_TOKEN was replaced (the first value was 10 characters).
# 2026-10-22: step `inspect` adds the 7-day per-chain log review (D); B/C superseded.
# 2026-10-21: step `inspect` also runs the owner-approved read-only prediction-freshness investigation.
# 2026-10-18: step `enable` sets EVENT_DETECTION_ENABLED=1 only, after the approved schedule (PR #95, 96ec8bc) is verified on main.
name: event-stage1
on:
  push:
    branches: [claude/epic-planck-uyapsw-event-stage1]
permissions:
  contents: read
  checks: read
concurrency:
  group: event-stage1
  cancel-in-progress: false
env:
  DB_NAME: sentiment-history
  DB_UUID: f91ca980-b886-423a-bd6f-f3baea46d181
  MIGRATION: .ai/migrations/0023_event_detection.sql
  MIGRATION_SHA256: 06d8bafa616684ba69c96b94e7e6e6f90371c2550aa2643ed5ee4cf3da4e3d91
  CODE_SHA: 410e68d6e73237600d52c562a03f617eda23cec6
  V2: https://pulseworker-v2.quiquandon.workers.dev
  V1: https://sentiment-ff75.quiquandon.workers.dev
  W: npx --yes wrangler@4.151.1
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Select step
        id: sel
        run: echo "step=$(tr -d '[:space:]' < .stage1-step)" >> "$GITHUB_OUTPUT"

      - name: Identity (all steps)
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          $W d1 info "$DB_NAME" --json > info.json
          jq -c '{uuid, name, version, num_tables, file_size, running_in_region}' info.json
          test "$(jq -r .uuid info.json)" = "$DB_UUID" || { echo "::error::DB identity mismatch"; exit 1; }

      - name: Recovery point and retention
        if: steps.sel.outputs.step == 'recovery'
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          echo "now: $(date -u +%FT%TZ)"
          echo "--- current bookmark"; $W d1 time-travel info "$DB_NAME" --json
          for d in 1 6 8 29; do
            ts=$(date -u -d "-$d days" +%FT%TZ)
            echo "--- bookmark for $ts (-$d d)"; $W d1 time-travel info "$DB_NAME" --timestamp="$ts" --json || echo "RESULT: not available for -$d d"
          done

      - name: Migration 0023 (additive)
        if: steps.sel.outputs.step == 'migrate'
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          echo "start: $(date -u +%FT%TZ)"
          echo "$MIGRATION_SHA256  $MIGRATION" | sha256sum -c -
          q() { $W d1 execute "$DB_NAME" --remote --json --command "$1"; }
          SCHEMA="SELECT type, name, tbl_name, sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' AND name NOT LIKE 'event%' AND name NOT LIKE 'idx_event%' ORDER BY type, name"
          COUNTS="SELECT (SELECT COUNT(*) FROM history) history_n,(SELECT MAX(ts) FROM history) history_max,(SELECT COUNT(*) FROM predictions) pred_n,(SELECT COUNT(*) FROM eth_predictions) eth_n,(SELECT COUNT(*) FROM link_predictions) link_n,(SELECT COUNT(*) FROM challenger_predictions) chal_n,(SELECT COUNT(*) FROM risk_regime_readings) rr_n,(SELECT COUNT(*) FROM sentiment_weight_adaptation) swa_n,(SELECT COUNT(*) FROM v1_methodology_versions) mv_n"
          pre=$(q "SELECT COUNT(*) n FROM sqlite_master WHERE name LIKE 'event%' OR name LIKE 'idx_event%'" | jq '.[0].results[0].n')
          test "$pre" = "0" || { echo "::error::event objects already exist ($pre)"; exit 1; }
          q "$SCHEMA" | jq -c '.[0].results' > schema_pre.json
          echo "pre schema: $(jq length schema_pre.json) objects, sha256 $(sha256sum schema_pre.json | cut -c1-64)"
          jq -c 'group_by(.type) | map({(.[0].type): length}) | add' schema_pre.json
          q "$COUNTS" | jq -c '.[0].results[0]' > counts_pre.json; echo "pre counts: $(cat counts_pre.json)"
          echo "--- restore point immediately before the migration ($(date -u +%FT%TZ))"; $W d1 time-travel info "$DB_NAME" --json
          $W d1 execute "$DB_NAME" --remote --yes --file="$MIGRATION"
          echo "applied: $(date -u +%FT%TZ)"
          q "SELECT type, name FROM sqlite_master WHERE name LIKE 'event%' OR name LIKE 'idx_event%' ORDER BY type, name" | jq -c '.[0].results' > ev.json; cat ev.json
          expected='[{"type":"index","name":"idx_event_ledger_corr"},{"type":"index","name":"idx_event_ledger_detected"},{"type":"index","name":"idx_event_ledger_type"},{"type":"table","name":"event_documents"},{"type":"table","name":"event_ledger"},{"type":"table","name":"event_observations"},{"type":"table","name":"event_runs"},{"type":"table","name":"event_source_health"}]'
          test "$(jq -cS . ev.json)" = "$(echo "$expected" | jq -cS .)" || { echo "::error::event objects differ from the expected 8"; exit 1; }
          q "$SCHEMA" | jq -c '.[0].results' > schema_post.json
          echo "post schema (excluding event objects): sha256 $(sha256sum schema_post.json | cut -c1-64)"
          cmp -s schema_pre.json schema_post.json || { echo "::error::pre-existing schema changed"; exit 1; }
          q "$COUNTS" | jq -c '.[0].results[0]' > counts_post.json; echo "post counts: $(cat counts_post.json)"
          for k in pred_n eth_n link_n chal_n swa_n mv_n; do test "$(jq .$k counts_pre.json)" = "$(jq .$k counts_post.json)" || { echo "::error::$k changed"; exit 1; }; done
          for k in history_n rr_n; do test "$(jq .$k counts_post.json)" -ge "$(jq .$k counts_pre.json)" || { echo "::error::$k decreased"; exit 1; }; done
          q "SELECT (SELECT COUNT(*) FROM event_ledger) ledger,(SELECT COUNT(*) FROM event_observations) obs,(SELECT COUNT(*) FROM event_source_health) health,(SELECT COUNT(*) FROM event_runs) runs,(SELECT COUNT(*) FROM event_documents) docs" | jq -c '.[0].results[0]'
          echo "--- bookmark after migration"; $W d1 time-travel info "$DB_NAME" --json
          echo "MIGRATION 0023: PASS"

      - name: Inspect (read-only; names and ids only, never values)
        if: steps.sel.outputs.step == 'inspect'
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          HAS_REPO_EVENT_RUN_TOKEN: "${{ secrets.EVENT_RUN_TOKEN != '' }}"
        run: |
          echo "at: $(date -u +%FT%TZ)"
          echo "--- Worker secret NAMES (pulseworker-v2)"
          $W secret list --name pulseworker-v2 --format json | jq -c '[.[] | {name, type}]'
          $W secret list --name pulseworker-v2 --format json | jq -e 'map(.name) | index("EVENT_DETECTION_ENABLED") == null' >/dev/null && echo "EVENT_DETECTION_ENABLED: absent" || echo "::warning::EVENT_DETECTION_ENABLED is present"
          echo "--- recent deployments (ids, times, source; no author)"
          $W deployments list --name pulseworker-v2 --json | jq -c '[.[-3:][] | {id, created_on, source, strategy, versions: [.versions[] | {version_id, percentage}], message: .annotations["workers/message"]}]'
          echo "--- recent versions"
          $W versions list --name pulseworker-v2 --json | jq -c '[.[-3:][] | {id, number, created_on: .metadata.created_on, source: .metadata.source, message: .annotations["workers/message"], tag: .annotations["workers/tag"]}]'
          echo "repo secret EVENT_RUN_TOKEN present: $HAS_REPO_EVENT_RUN_TOKEN"
          # --- 2026-10-21 V2 prediction-freshness investigation (owner-approved, read-only, targeted).
          # Prints counts, timestamps, statuses and truncated error text only: no prediction values, no secrets.
          set +e
          ACCT=f58e761fbc8e62dc404d8684290af264
          NOW_MS=$(( $(date +%s) * 1000 )); SINCE_MS=$(( NOW_MS - 7*24*3600*1000 )); T=10800000; G=300000
          echo "=== A. cron-grid prediction rows per 3h tick, last 7 days (since $(date -u -d @$((SINCE_MS/1000)) +%FT%TZ))"
          SQL="SELECT 'BTC' coin, horizon_hours h, 'core' m, (ts/$T)*$T tick, COUNT(*) n, MIN(ts) t0, MAX(ts) t1 FROM predictions WHERE ts >= $SINCE_MS AND ts % $T < $G GROUP BY h, tick
          UNION ALL SELECT 'ETH', horizon_hours, 'core', (ts/$T)*$T, COUNT(*), MIN(ts), MAX(ts) FROM eth_predictions WHERE ts >= $SINCE_MS AND ts % $T < $G GROUP BY horizon_hours, (ts/$T)*$T
          UNION ALL SELECT 'LINK', horizon_hours, 'core', (ts/$T)*$T, COUNT(*), MIN(ts), MAX(ts) FROM link_predictions WHERE ts >= $SINCE_MS AND ts % $T < $G GROUP BY horizon_hours, (ts/$T)*$T
          UNION ALL SELECT coin, horizon_hours, 'challenger', (ts/$T)*$T, COUNT(*), MIN(ts), MAX(ts) FROM challenger_predictions WHERE ts >= $SINCE_MS AND ts % $T < $G GROUP BY coin, horizon_hours, (ts/$T)*$T"
          $W d1 execute "$DB_NAME" --remote --json --command "$SQL" > grid.json; echo "d1 rc=$?"
          jq --argjson since "$SINCE_MS" --argjson now "$NOW_MS" --argjson T "$T" -r '
            (.[0].results) as $r
            | [range((($since / $T) | ceil) * $T; $now - 600000; $T)] as $ticks
            | [ "BTC","ETH","LINK" ] as $coins
            | [ $coins[] as $c | (12,24) as $h | ("core","challenger") as $m | "\($c)/\($h)/\($m)" ] as $series
            | ($r | map({key: "\(.coin)/\(.h)/\(.m)@\(.tick)", value: .}) | from_entries) as $ix
            | "ticks expected: \($ticks|length); series: \($series|length); rows on grid: \($r|map(.n)|add)",
              "per-series ticks present (of \($ticks|length)): " + ([ $series[] as $s | "\($s)=\([ $ticks[] | select($ix["\($s)@\(.)"]) ] | length)" ] | join(" ")),
              "duplicates (n>1): \([ $r[] | select(.n > 1) | "\(.coin)/\(.h)/\(.m)@\(.tick/1000|todate)x\(.n)" ] | join(" "))",
              "--- ticks with missing series (tick UTC: missing count / missing list; write span = max-min ts of present rows, s)",
              ( $ticks[] as $t
                | [ $series[] | select($ix["\(.)@\($t)"] | not) ] as $miss
                | [ $series[] | $ix["\(.)@\($t)"] | select(.) ] as $pres
                | select(($miss|length) > 0)
                | "\($t/1000|todate): \($miss|length) missing [\($miss|join(","))] present=\($pres|length) span_s=\(if ($pres|length)>0 then ((($pres|map(.t1)|max) - ($pres|map(.t0)|min))/1000|floor) else null end)" ),
              "--- write latency of complete ticks: max seconds after tick start = \([ $ticks[] as $t | [ $series[] | $ix["\(.)@\($t)"] | select(.) ] | select(length==12) | ((map(.t1)|max) - $t)/1000 | floor ] | (if length>0 then {min: min, median: (sort|.[length/2|floor]), max: max} else null end))"
          ' grid.json
          echo "=== D. 7-day Worker log review (owner-approved 2026-10-22): per tick, per chain; warnings; 429s outside ticks"
          tq() { # $1 from_ms $2 to_ms $3 extra filter json (or empty) -> logs page on stdout
            local f; f=$(jq -nc --argjson f "$1" --argjson t "$2" --argjson x "${3:-null}" '{queryId: "pf-7d", timeframe: {from: $f, to: $t}, view: "events", limit: 1000, parameters: {filters: ([{key: "$workers.scriptName", operation: "eq", type: "string", value: "pulseworker-v2"}] + (if $x then [$x] else [] end))}}')
            curl -sS -m 60 -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/observability/telemetry/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$f"; }
          EV='[.result.events.events[]? | {ts: (.timestamp // 0), level: (.["$metadata"].level // (if (.source|type)=="object" then .source.level else null end) // .level // ""), j: (if (.source|type)=="object" and .source.evt then .source else null end), msg: ((.["$metadata"].message // (if (.source|type)=="object" then .source.message else null end) // .message // (.source|tostring)) | tostring)}]'
          : > ticks.jsonl
          FIRST_TICK=$(( (SINCE_MS / T + 1) * T ))
          for (( t=FIRST_TICK; t <= NOW_MS - 1800000; t += T )); do
            tq "$t" $(( t + 1800000 )) "" | jq -c --argjson t "$t" "{tick: \$t, ok: (.success == true), err: ([.errors[]?.message] | .[0:1]), ev: $EV}" >> ticks.jsonl
          done
          jq -s -r --argjson T "$T" '
            def red: gsub("(?i)(token|key|secret|authorization|bearer)[^ ,\"]*"; "[redacted]") | .[0:140];
            def norm: gsub("[0-9]+"; "#");
            . as $all
            | ([ $all[] | select(.ok) | .ev[] ] ) as $evs
            | "windows queried: \($all|length); ok: \([ $all[] | select(.ok) ] | length); first error: \([ $all[] | select(.ok|not) | .err[0] ] | .[0] // "none" | tostring | red)",
              "log retention: earliest event returned = \(if ($evs|length)>0 then ($evs | map(.ts) | min / 1000 | floor | todate) else "none" end); events total = \($evs|length)",
              "--- per tick: chains (coin/h: started? result) -- only ticks with a non-ok chain or a warning are listed",
              ( $all[] | select(.ok) | .tick as $tk
                | [ .ev[] | . as $e | (.j // (try (.msg | fromjson) catch null)) as $j | select($j and $j.evt) | $j + {lvl: $e.level} ] as $js
                | [ "BTC","LINK","ETH" ] as $coins
                | [ $coins[] as $c | (24,12) as $h
                    | [ $js[] | select(.coin == $c and .horizon == $h) ] as $cj
                    | { k: "\($c)/\($h)",
                        started: ([ $cj[] | select(.evt=="chain_start") ] | length > 0),
                        done: ([ $cj[] | select(.evt=="prediction_done") ] | .[0]),
                        failed: ([ $cj[] | select(.evt=="prediction_failed") ] | .[0]) } ] as $ch
                | [ .ev[] | select(.level == "warn" or .level == "warning") ] as $w
                | select(([ $ch[] | select(.failed or (.started|not) or (.done and (.done.prediction_status != "ok"))) ] | length) > 0 or ($w|length) > 0)
                | "\($tk/1000|todate): " + ([ $ch[] | "\(.k)=" + (if .failed then "FAILED(\(.failed.error_message|tostring|red); \(.failed.elapsed_ms)ms)" elif .done then "done(\(.done.prediction_status // "?")/chal:\(.done.challenger_status // .done.challenger_ok | tostring))" elif .started then "started-no-result" else "NOT-STARTED" end) ] | join(" | ")) + (if ($w|length)>0 then "  warnings=\($w|length)" else "" end) ),
              "--- error messages in tick windows (count, normalised)",
              ( [ $evs[] | select(.level == "error") | . as $x | (if $x.j then ($x.j.error_message // $x.j.evt) else (try ($x.msg|fromjson|.error_message // .evt) catch $x.msg) end) | tostring | red | norm ] | group_by(.) | map("\(length)x \(.[0])") | .[] ),
              "--- warning messages in tick windows (count, normalised)",
              ( [ $evs[] | select(.level == "warn" or .level == "warning") | . as $x | (if $x.j then ($x.j.evt + " " + (($x.j.error_message // $x.j.reason // $x.j.status // "")|tostring)) else (try ($x.msg|fromjson|.evt + " " + ((.error_message // .reason // .status // "")|tostring)) catch $x.msg) end) | tostring | red | norm ] | group_by(.) | map("\(length)x \(.[0])") | .[] )
          ' ticks.jsonl
          echo "--- 429 mentions anywhere in the last 7 days (error level, whole range; page limit 1000)"
          tq "$SINCE_MS" "$NOW_MS" '{"key":"$metadata.level","operation":"eq","type":"string","value":"error"}' > err7.json
          jq -r --argjson T "$T" "$EV"' as $e
            | ($e | map(select(.msg | test("429")))) as $r
            | "error events: \($e|length); with 429: \($r|length); in first 30 min of a 3h tick: \($r | map(select(((.ts/1000|floor) % 10800) < 1800)) | length); outside: \($r | map(select(((.ts/1000|floor) % 10800) >= 1800)) | length)",
              "429 by UTC hour-of-day: \($r | map(.ts/1000|floor|todate|.[11:13]) | group_by(.) | map("\(.[0])h=\(length)") | join(" "))",
              "earliest error event: \(if ($e|length)>0 then ($e|map(.ts)|min/1000|floor|todate) else "none" end)"' err7.json
          set -e
          echo "PREDICTION FRESHNESS INVESTIGATION: done (read-only)"

      - name: Pre-deploy gates (read-only; the run token is never printed)
        if: steps.sel.outputs.step == 'predeploy' || steps.sel.outputs.step == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          RUN_TOKEN: '${{ secrets.EVENT_RUN_TOKEN }}'
        run: |
          set -euo pipefail
          echo "at: $(date -u +%FT%TZ)"
          # 1. repository secret: present, >= 32 printable non-space characters (length only is reported)
          [ -n "$RUN_TOKEN" ] || { echo "::error::repository secret EVENT_RUN_TOKEN not available to this workflow"; exit 1; }
          n=${#RUN_TOKEN}
          [[ "$RUN_TOKEN" =~ ^[[:graph:]]+$ ]] || { echo "::error::EVENT_RUN_TOKEN contains whitespace or control characters"; exit 1; }
          [ "$n" -ge 32 ] || { echo "::error::EVENT_RUN_TOKEN is shorter than 32 characters ($n)"; exit 1; }
          echo "EVENT_RUN_TOKEN: available, printable, length $n (>= 32)"
          # 2. code: this branch differs from the reviewed commit only by the stage workflow and its step file
          diff=$(git diff --name-only "$CODE_SHA" HEAD | sort | tr '\n' ' ')
          [ "$diff" = ".github/workflows/event-stage1.yml .stage1-step " ] || { echo "::error::branch differs from $CODE_SHA beyond the stage files: $diff"; exit 1; }
          echo "code identical to $CODE_SHA except: $diff"
          # 2b. CI: the 'test' check run on the reviewed commit concluded success
          ci=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/commits/$CODE_SHA/check-runs?check_name=test" | jq -r '[.check_runs[] | .conclusion] | join(",")')
          [ "$ci" = "success" ] || { echo "::error::CI 'test' on $CODE_SHA is '$ci', not success"; exit 1; }
          echo "CI test on $CODE_SHA: success"
          # 3. database: migration 0023 objects present, exactly 8, tables empty
          q() { $W d1 execute "$DB_NAME" --remote --json --command "$1"; }
          q "SELECT type, name FROM sqlite_master WHERE name LIKE 'event%' OR name LIKE 'idx_event%' ORDER BY type, name" | jq -c '.[0].results' > ev.json
          expected='[{"type":"index","name":"idx_event_ledger_corr"},{"type":"index","name":"idx_event_ledger_detected"},{"type":"index","name":"idx_event_ledger_type"},{"type":"table","name":"event_documents"},{"type":"table","name":"event_ledger"},{"type":"table","name":"event_observations"},{"type":"table","name":"event_runs"},{"type":"table","name":"event_source_health"}]'
          test "$(jq -cS . ev.json)" = "$(echo "$expected" | jq -cS .)" || { echo "::error::event schema objects differ"; cat ev.json; exit 1; }
          echo "event schema: 8 expected objects present"
          q "SELECT (SELECT COUNT(*) FROM event_ledger) ledger,(SELECT COUNT(*) FROM event_observations) obs,(SELECT COUNT(*) FROM event_source_health) health,(SELECT COUNT(*) FROM event_runs) runs,(SELECT COUNT(*) FROM event_documents) docs,(SELECT COUNT(*) FROM history) history_n,(SELECT MAX(ts) FROM history) history_max,(SELECT COUNT(*) FROM predictions) pred_n,(SELECT MAX(ts) FROM predictions) pred_max,(SELECT COUNT(*) FROM eth_predictions) eth_n,(SELECT COUNT(*) FROM link_predictions) link_n,(SELECT COUNT(*) FROM challenger_predictions) chal_n,(SELECT COUNT(*) FROM risk_regime_readings) rr_n,(SELECT COUNT(*) FROM sentiment_weight_adaptation) swa_n" | jq -c '.[0].results[0]' | tee counts_pre.json
          # event store must be exactly as left by the single authorised run (edr_c46163d70fa2f878): no other run happened
          test "$(jq -c '{runs, ledger, obs, health, docs}' counts_pre.json)" = '{"runs":1,"ledger":0,"obs":40,"health":5,"docs":0}' || { echo "::error::event store differs from the recorded post-integration state"; exit 1; }
          q "SELECT run_id FROM event_runs" | jq -r '.[0].results[].run_id' | tee run_ids_pre.txt
          [ "$(cat run_ids_pre.txt)" = "edr_c46163d70fa2f878" ] || { echo "::error::unexpected event_runs content"; exit 1; }
          # 4. Worker secrets (names only): EVENT_DETECTION_ENABLED absent
          $W secret list --name pulseworker-v2 --format json | jq -c 'map(.name)' | tee names_pre.json
          jq -e 'index("EVENT_RUN_TOKEN") != null and index("EVENT_DETECTION_ENABLED") == null and index("EVENT_SEC_USER_AGENT") == null and index("EVENT_BINANCE_SAMPLE_MS") == null' names_pre.json >/dev/null || { echo "::error::Worker secret names not as required"; exit 1; }
          echo "EVENT_RUN_TOKEN: present; EVENT_DETECTION_ENABLED, EVENT_SEC_USER_AGENT, EVENT_BINANCE_SAMPLE_MS: absent"
          # 5. current live version (rollback target) and bundle build
          $W deployments list --name pulseworker-v2 --json | jq -c '.[-1] | {id, created_on, versions: [.versions[] | {version_id, percentage}]}' | tee live_pre.json
          $W deploy --dry-run --outdir "$RUNNER_TEMP/bundle" --var GIT_COMMIT_SHA:$CODE_SHA > dryrun.log 2>&1 || { cat dryrun.log; echo "::error::bundle build failed"; exit 1; }
          grep -E "Total Upload|env\.|D1 Database" dryrun.log
          echo "PRE-DEPLOY GATES: PASS"

      - name: Deploy reviewed Worker code (CODE_SHA, no secret changes); verify; no detection run
        if: steps.sel.outputs.step == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          RUN_TOKEN: '${{ secrets.EVENT_RUN_TOKEN }}'
        run: |
          set -euo pipefail
          echo "deploy start: $(date -u +%FT%TZ)"
          $W deploy --var GIT_COMMIT_SHA:$CODE_SHA > deploy.log 2>&1 || { cat deploy.log; echo "::error::wrangler deploy failed"; exit 1; }
          grep -E "Uploaded|Deployed|Current Version ID|Total Upload|schedule|https://|env\.|Worker Startup" deploy.log || true
          echo "deploy end: $(date -u +%FT%TZ)"
          $W deployments list --name pulseworker-v2 --json | jq -c '.[-1] | {id, created_on, versions: [.versions[] | {version_id, percentage}]}' | tee live_post.json
          test "$(jq -r '.versions[0].version_id' live_post.json)" != "$(jq -r '.versions[0].version_id' live_pre.json)" || { echo "::error::live version did not change"; exit 1; }
          $W secret list --name pulseworker-v2 --format json | jq -c 'map(.name)' | tee names_post.json
          cmp -s names_pre.json names_post.json || { echo "::error::Worker secret names changed during deploy"; exit 1; }
          fail=0; check() { if eval "$2"; then echo "PASS  $1"; else echo "FAIL  $1"; fail=1; fi; }
          # event health: wait for the new version to serve
          for i in $(seq 1 18); do
            code=$(curl -sS -m 15 -o health.json -w '%{http_code}' "$V2/api/events/health" || echo 000)
            [ "$code" = "200" ] && break; sleep 5
          done
          echo "health HTTP $code: $(jq -c '{ok, available, enabled, ruleset, detectors: [.detectors[] | {id, status}], last_run}' health.json)"
          check "health 200, available, enabled=false" '[ "$code" = 200 ] && jq -e ".available == true and .enabled == false" health.json >/dev/null'
          check "health still shows only the authorised run; Binance DISABLED, SEC NOT_CONFIGURED" 'jq -e "(.last_run.run_id == \"edr_c46163d70fa2f878\") and (.detectors | map(select(.id==\"binance_liquidation_sample\")) | .[0].status == \"DISABLED\") and (.detectors | map(select(.id==\"sec_edgar\")) | .[0].status == \"NOT_CONFIGURED\")" health.json >/dev/null'
          code=$(curl -sS -m 15 -o events.json -w '%{http_code}' "$V2/api/events"); echo "events HTTP $code: $(jq -c '{ok, available, count}' events.json)"
          check "/api/events 200, count 0" '[ "$code" = 200 ] && jq -e ".count == 0" events.json >/dev/null'
          code=$(curl -sS -m 15 -o r1.json -w '%{http_code}' -X POST "$V2/api/events/run"); echo "run without auth -> $code $(cat r1.json)"
          check "POST /api/events/run without auth -> 401" '[ "$code" = 401 ]'
          code=$(curl -sS -m 15 -o r2.json -w '%{http_code}' -X POST -H "Authorization: Bearer not-the-token-0123456789abcdef" "$V2/api/events/run"); echo "run with wrong token -> $code $(cat r2.json)"
          check "POST /api/events/run with wrong token -> 401" '[ "$code" = 401 ]'
          code=$(curl -sS -m 15 -o r3.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${RUN_TOKEN}" -H 'X-Event-Trigger: schedule' "$V2/api/events/run"); echo "scheduled run while disabled -> $code $(cat r3.json)"
          check "scheduled run refused while disabled -> 409 DISABLED" '[ "$code" = 409 ] && jq -e ".status == \"DISABLED\"" r3.json >/dev/null'
          # existing endpoints
          for u in "$V2/" "$V2/prediction-freshness" "$V2/api/learning/candidates" "$V1/risk-regime" "$V1/hl-oi" "$V1/history"; do
            code=$(curl -sS -m 20 -o ep.json -w '%{http_code}' "$u"); check "GET $u -> 200" '[ "$code" = 200 ]'
          done
          curl -sS -m 20 "$V2/prediction-freshness" | jq -c '[.coins | to_entries[] | .key as $c | .value.horizons | to_entries[] | .key as $h | .value | to_entries[] | {c: $c, h: $h, m: .key, status: .value.status, sha: (.value.latest_git_commit_sha // "")[0:7]}] | group_by(.status, .sha) | map({status: .[0].status, sha: .[0].sha, n: length})' | tee pf.json
          check "prediction-freshness all FRESH" 'jq -e "all(.status == \"FRESH\")" pf.json >/dev/null'
          # nothing was collected; V1 data intact
          q() { $W d1 execute "$DB_NAME" --remote --json --command "$1"; }
          q "SELECT (SELECT COUNT(*) FROM event_ledger) ledger,(SELECT COUNT(*) FROM event_observations) obs,(SELECT COUNT(*) FROM event_source_health) health,(SELECT COUNT(*) FROM event_runs) runs,(SELECT COUNT(*) FROM event_documents) docs,(SELECT COUNT(*) FROM history) history_n,(SELECT MAX(ts) FROM history) history_max,(SELECT COUNT(*) FROM predictions) pred_n,(SELECT MAX(ts) FROM predictions) pred_max,(SELECT COUNT(*) FROM eth_predictions) eth_n,(SELECT COUNT(*) FROM link_predictions) link_n,(SELECT COUNT(*) FROM challenger_predictions) chal_n,(SELECT COUNT(*) FROM risk_regime_readings) rr_n,(SELECT COUNT(*) FROM sentiment_weight_adaptation) swa_n" | jq -c '.[0].results[0]' | tee counts_post.json
          check "no event run / rows written by the deploy" '[ "$(jq -c "{runs, ledger, obs, health, docs}" counts_pre.json)" = "$(jq -c "{runs, ledger, obs, health, docs}" counts_post.json)" ]'
          check "weight adaptation unchanged" '[ "$(jq .swa_n counts_pre.json)" = "$(jq .swa_n counts_post.json)" ]'
          [ "$fail" = 0 ] || { echo "::error::post-deploy verification failed (no automatic rollback; rollback target in live_pre.json)"; exit 1; }
          echo "DEPLOY + VERIFICATION: PASS (no detection run executed)"

      - name: Enable controlled collection - set EVENT_DETECTION_ENABLED=1 only (no run, no other change)
        if: steps.sel.outputs.step == 'enable'
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          EXPECTED_VERSION: 6129d19c-beb6-40b5-b66b-5e352b93cfa4
          EXPECTED_SHA: 5056aa4f84235689626dc685e25ce8d2de23c891
          SCHEDULE_SHA: 96ec8bc9df274e08e4b81d8012e592cbe4ff58ea
        run: |
          set -euo pipefail
          q() { $W d1 execute "$DB_NAME" --remote --json --command "$1" | jq -c '.[0].results'; }
          gh_api() { curl -sS -H "Authorization: Bearer ${{ github.token }}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/$1"; }
          V1Q="SELECT (SELECT COUNT(*) FROM history) history_n,(SELECT MAX(ts) FROM history) history_max,(SELECT COUNT(*) FROM predictions) pred_n,(SELECT MAX(ts) FROM predictions) pred_max,(SELECT COUNT(*) FROM eth_predictions) eth_n,(SELECT COUNT(*) FROM link_predictions) link_n,(SELECT COUNT(*) FROM challenger_predictions) chal_n,(SELECT COUNT(*) FROM risk_regime_readings) rr_n,(SELECT COUNT(*) FROM sentiment_weight_adaptation) swa_n,(SELECT COUNT(*) FROM v1_methodology_versions) mv_n"
          EVQ="SELECT (SELECT COUNT(*) FROM event_runs) runs,(SELECT COUNT(*) FROM event_ledger) ledger,(SELECT COUNT(*) FROM event_observations) obs,(SELECT COUNT(*) FROM event_source_health) health,(SELECT COUNT(*) FROM event_documents) docs"
          endpoints() { for u in "$V2/" "$V2/prediction-freshness" "$V2/api/learning/candidates" "$V2/api/events/health" "$V2/api/events" "$V1/risk-regime" "$V1/hl-oi" "$V1/history" "$V1/weight-adaptation"; do printf '%s %s\n' "$(curl -sS -m 25 -o /dev/null -w '%{http_code}' "$u")" "$u"; done; }
          freshness() { curl -sS -m 25 "$V2/prediction-freshness" | jq -c '[.coins | to_entries[] | .key as $c | .value.horizons | to_entries[] | .key as $h | .value | to_entries[] | {status: .value.status, sha: (.value.latest_git_commit_sha // "")[0:7]}] | group_by(.status, .sha) | map({status: .[0].status, sha: .[0].sha, n: length})'; }
          vsha() { $W versions view "$1" --name pulseworker-v2 --json | jq -r '[.. | objects | select(.name? == "GIT_COMMIT_SHA") | (.text // .value // empty)] | first // empty'; }
          echo "=== GATES $(date -u +%FT%TZ)"
          # 1. the approved schedule is installed and active on main, at the merge commit, with CI success
          wf=$(gh_api actions/workflows/event-detection-schedule.yml | jq -r '.path + " " + .state'); echo "schedule workflow: $wf"
          [ "$wf" = ".github/workflows/event-detection-schedule.yml active" ] || { echo "::error::schedule workflow not installed/active"; exit 1; }
          main=$(gh_api git/ref/heads/main | jq -r .object.sha); echo "main: $main"
          git fetch -q origin main; git merge-base --is-ancestor "$SCHEDULE_SHA" origin/main || { echo "::error::main does not contain $SCHEDULE_SHA"; exit 1; }
          ci=$(gh_api "commits/$SCHEDULE_SHA/check-runs?check_name=test" | jq -r '[.check_runs[] | .conclusion] | join(",")')
          [ "$ci" = "success" ] || { echo "::error::CI 'test' on $SCHEDULE_SHA is '$ci'"; exit 1; }
          echo "CI test on $SCHEDULE_SHA: success"
          # the installed workflow must still be schedule-only at :23 and send the schedule header
          git show "origin/main:.github/workflows/event-detection-schedule.yml" > sched.yml
          grep -q "cron: '23 \* \* \* \*'" sched.yml && grep -q "X-Event-Trigger: schedule" sched.yml && grep -q '^permissions: {}' sched.yml || { echo "::error::installed schedule differs from the approved one"; exit 1; }
          # 2. live Worker = the merged #94 code, unchanged since its deploy
          $W deployments list --name pulseworker-v2 --json | jq -c '.[-1] | {id, created_on, versions: [.versions[] | {version_id, percentage}]}' | tee live_pre.json
          test "$(jq -r '.versions[0].version_id' live_pre.json)" = "$EXPECTED_VERSION" && test "$(jq -r '.versions[0].percentage' live_pre.json)" = "100" || { echo "::error::live version is not $EXPECTED_VERSION at 100%"; exit 1; }
          [ "$(vsha "$EXPECTED_VERSION")" = "$EXPECTED_SHA" ] || { echo "::error::live GIT_COMMIT_SHA is not $EXPECTED_SHA"; exit 1; }
          echo "live: $EXPECTED_VERSION (GIT_COMMIT_SHA $EXPECTED_SHA)"
          # 3. secret names (never values): flag absent; SEC and Binance stay unset
          $W secret list --name pulseworker-v2 --format json | jq -c 'map(.name) | sort' | tee names_pre.json
          jq -e 'index("EVENT_RUN_TOKEN") != null and index("EVENT_DETECTION_ENABLED") == null and index("EVENT_SEC_USER_AGENT") == null and index("EVENT_BINANCE_SAMPLE_MS") == null and index("FRED_API_KEY") == null' names_pre.json >/dev/null || { echo "::error::Worker secret names not as required"; exit 1; }
          curl -sS -m 20 "$V2/api/events/health" > h_pre.json; jq -c '{available, enabled, last_run: .last_run.run_id, detectors: [.detectors[] | {id, status}]}' h_pre.json
          jq -e '.available == true and .enabled == false' h_pre.json >/dev/null || { echo "::error::health not available/disabled before enabling"; exit 1; }
          q "$EVQ" | tee ev_pre.json; q "$V1Q" | tee v1_pre.json
          endpoints | tee ep_pre.txt; freshness | tee fr_pre.json
          echo "=== SET EVENT_DETECTION_ENABLED=1 $(date -u +%FT%TZ)"
          printf '1' | $W secret put EVENT_DETECTION_ENABLED --name pulseworker-v2 > put.log 2>&1 || { cat put.log; echo "::error::secret put failed"; exit 1; }
          grep -vi 'token' put.log || true
          echo "set: $(date -u +%FT%TZ)"
          echo "=== VERIFY"
          fail=0; check() { if eval "$2"; then echo "PASS  $1"; else echo "FAIL  $1"; fail=1; fi; }
          $W deployments list --name pulseworker-v2 --json | jq -c '.[-1] | {id, created_on, versions: [.versions[] | {version_id, percentage}]}' | tee live_post.json
          NEWV=$(jq -r '.versions[0].version_id' live_post.json); echo "new version: $NEWV"
          check "new version at 100% carries GIT_COMMIT_SHA $EXPECTED_SHA (code unchanged)" '[ "$(jq -r ".versions[0].percentage" live_post.json)" = 100 ] && [ "$(vsha "$NEWV")" = "$EXPECTED_SHA" ]'
          $W secret list --name pulseworker-v2 --format json | jq -c 'map(.name) | sort' | tee names_post.json
          check "secret names = before + EVENT_DETECTION_ENABLED only" '[ "$(jq -c ". + [\"EVENT_DETECTION_ENABLED\"] | sort" names_pre.json)" = "$(cat names_post.json)" ]'
          for i in $(seq 1 24); do curl -sS -m 15 "$V2/api/events/health" > h_post.json || true; jq -e '.enabled == true' h_post.json >/dev/null 2>&1 && break; sleep 5; done
          jq -c '{available, enabled, last_run: .last_run.run_id, detectors: [.detectors[] | {id, status}]}' h_post.json
          check "health enabled=true; Binance DISABLED; SEC NOT_CONFIGURED" 'jq -e "(.enabled == true) and (.detectors | map(select(.id==\"binance_liquidation_sample\")) | .[0].status == \"DISABLED\") and (.detectors | map(select(.id==\"sec_edgar\")) | .[0].status == \"NOT_CONFIGURED\")" h_post.json >/dev/null'
          # authorisation: no valid token is ever accepted (the valid token is NOT used here: that would start a run)
          a1=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' -X POST "$V2/api/events/run")
          a2=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer not-the-token-0123456789abcdef" -H 'X-Event-Trigger: schedule' "$V2/api/events/run")
          check "run without token -> 401 ($a1); wrong token with schedule header -> 401 ($a2)" '[ "$a1" = 401 ] && [ "$a2" = 401 ]'
          q "$EVQ" | tee ev_post.json
          check "no event run triggered by enabling" '[ "$(jq -c ".[0].runs" ev_pre.json)" = "$(jq -c ".[0].runs" ev_post.json)" ]'
          q "$V1Q" | tee v1_post.json
          check "V1 prediction/weight/methodology counts not decreased; weight adaptation and methodology unchanged" '(for k in history_n pred_n eth_n link_n chal_n rr_n; do [ "$(jq ".[0].$k" v1_post.json)" -ge "$(jq ".[0].$k" v1_pre.json)" ] || exit 1; done) && [ "$(jq ".[0].swa_n" v1_pre.json)" = "$(jq ".[0].swa_n" v1_post.json)" ] && [ "$(jq ".[0].mv_n" v1_pre.json)" = "$(jq ".[0].mv_n" v1_post.json)" ]'
          endpoints | tee ep_post.txt
          check "endpoint status codes unchanged" 'diff ep_pre.txt ep_post.txt'
          freshness | tee fr_post.json
          check "prediction-freshness all FRESH" 'jq -e "all(.status == \"FRESH\")" fr_post.json >/dev/null'
          [ "$fail" = 0 ] || { echo "::error::verification failed. Stop collection: npx wrangler secret delete EVENT_DETECTION_ENABLED (rollback target in live_pre.json)"; exit 1; }
          echo "ENABLE: PASS ($(date -u +%FT%TZ)); first scheduled run expected at the next :23 slot"

      - name: Stage 2 - exactly one manual event-detection run, with pre/post evidence
        if: steps.sel.outputs.step == 'run'
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          RUN_TOKEN: '${{ secrets.EVENT_RUN_TOKEN }}'
          EXPECTED_VERSION: 9fcc142f-7e86-4fbe-a16a-d765b1f502bf
          PRIOR_RUN: edr_c46163d70fa2f878
        run: |
          set -euo pipefail
          q() { $W d1 execute "$DB_NAME" --remote --json --command "$1" | jq -c '.[0].results'; }
          V1Q="SELECT (SELECT COUNT(*) FROM history) history_n,(SELECT MAX(ts) FROM history) history_max,(SELECT COUNT(*) FROM predictions) pred_n,(SELECT MAX(ts) FROM predictions) pred_max,(SELECT COUNT(*) FROM eth_predictions) eth_n,(SELECT MAX(ts) FROM eth_predictions) eth_max,(SELECT COUNT(*) FROM link_predictions) link_n,(SELECT MAX(ts) FROM link_predictions) link_max,(SELECT COUNT(*) FROM challenger_predictions) chal_n,(SELECT MAX(ts) FROM challenger_predictions) chal_max,(SELECT COUNT(*) FROM risk_regime_readings) rr_n,(SELECT MAX(ts) FROM risk_regime_readings) rr_max,(SELECT COUNT(*) FROM sentiment_weight_adaptation) swa_n,(SELECT MAX(run_ts) FROM sentiment_weight_adaptation) swa_max,(SELECT COUNT(*) FROM v1_methodology_versions) mv_n"
          EVQ="SELECT (SELECT COUNT(*) FROM event_runs) runs,(SELECT COUNT(*) FROM event_ledger) ledger,(SELECT COUNT(*) FROM event_observations) obs,(SELECT COUNT(*) FROM event_source_health) health,(SELECT COUNT(*) FROM event_documents) docs"
          SCHEMA="SELECT type, name, tbl_name, sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name"
          endpoints() { for u in "$V2/" "$V2/prediction-freshness" "$V2/api/learning/candidates" "$V2/api/events/health" "$V2/api/events" "$V1/risk-regime" "$V1/hl-oi" "$V1/history" "$V1/weight-adaptation"; do printf '%s %s\n' "$(curl -sS -m 25 -o /dev/null -w '%{http_code}' "$u")" "$u"; done; }
          freshness() { curl -sS -m 25 "$V2/prediction-freshness" | jq -c '[.coins | to_entries[] | .key as $c | .value.horizons | to_entries[] | .key as $h | .value | to_entries[] | {status: .value.status, sha: (.value.latest_git_commit_sha // "")[0:7]}] | group_by(.status, .sha) | map({status: .[0].status, sha: .[0].sha, n: length})'; }
          echo "=== PRE-RUN CHECKS $(date -u +%FT%TZ)"
          $W deployments list --name pulseworker-v2 --json | jq -c '.[-1] | {id, created_on, versions: [.versions[] | {version_id, percentage}]}' | tee live.json
          test "$(jq -r '.versions[0].version_id' live.json)" = "$EXPECTED_VERSION" && test "$(jq -r '.versions[0].percentage' live.json)" = "100" || { echo "::error::live version is not $EXPECTED_VERSION at 100%"; exit 1; }
          # deployed code SHA (plain-text var of the live version; never a secret)
          $W versions view "$EXPECTED_VERSION" --name pulseworker-v2 --json > ver.json
          dsha=$(jq -r '[.. | objects | select(.name? == "GIT_COMMIT_SHA") | (.text // .value // empty)] | first // empty' ver.json)
          echo "deployed GIT_COMMIT_SHA: ${dsha:-<not found>}"
          [ "$dsha" = "$CODE_SHA" ] || { echo "::error::deployed GIT_COMMIT_SHA is not $CODE_SHA"; exit 1; }
          $W secret list --name pulseworker-v2 --format json | jq -c 'map(.name)' | tee names.json
          jq -e 'index("EVENT_RUN_TOKEN") != null and index("EVENT_DETECTION_ENABLED") == null and index("EVENT_SEC_USER_AGENT") == null and index("EVENT_BINANCE_SAMPLE_MS") == null' names.json >/dev/null || { echo "::error::Worker secret names not as expected"; exit 1; }
          echo "EVENT_RUN_TOKEN set; EVENT_DETECTION_ENABLED, EVENT_SEC_USER_AGENT, EVENT_BINANCE_SAMPLE_MS absent"
          [ ${#RUN_TOKEN} -ge 32 ] || { echo "::error::repository EVENT_RUN_TOKEN too short"; exit 1; }
          curl -sS -m 20 "$V2/api/events/health" > h_pre.json; jq -c '{available, enabled, last_run, detectors: [.detectors[] | {id, status}]}' h_pre.json
          jq -e '.available == true and .enabled == false' h_pre.json >/dev/null || { echo "::error::health not available/disabled"; exit 1; }
          q "$EVQ" | tee ev_pre.json
          # single-run guard: the store must hold exactly the one recorded run; anything else (incl. a re-run of this job) refuses
          q "SELECT run_id FROM event_runs ORDER BY started_ts" | jq -r '.[].run_id' > runs_pre.txt
          [ "$(cat runs_pre.txt)" = "$PRIOR_RUN" ] || { echo "::error::event_runs is not exactly [$PRIOR_RUN]; refusing to run (exactly-one rule)"; cat runs_pre.txt; exit 1; }
          echo "event_runs before: $(tr '\n' ' ' < runs_pre.txt)"
          q "$V1Q" | tee v1_pre.json
          q "$SCHEMA" > schema_pre.json; echo "schema objects $(jq length schema_pre.json) sha256 $(sha256sum schema_pre.json | cut -c1-16)"
          endpoints | tee ep_pre.txt; freshness | tee fr_pre.json
          echo "--- restore point before the run"; $W d1 time-travel info "$DB_NAME" --json | jq -c .
          echo "=== THE ONE MANUAL RUN"
          t0=$(date -u +%FT%T.%3NZ); echo "POST start: $t0"
          set +e
          code=$(curl -sS --max-time 240 -o run.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${RUN_TOKEN}" "$V2/api/events/run")
          rc=$?
          set -e
          echo "POST end: $(date -u +%FT%T.%3NZ)  curl_rc=$rc  http=$code"
          jq . run.json 2>/dev/null || head -c 2000 run.json
          echo "=== POST-RUN EVIDENCE $(date -u +%FT%TZ)"
          q "$EVQ" | tee ev_post.json
          echo "--- event_runs"; q "SELECT run_id, trigger, started_ts, finished_ts, finished_ts - started_ts AS duration_ms, summary_json FROM event_runs" | jq -c '.[] | .summary = (.summary_json | fromjson) | del(.summary_json)'
          echo "--- event_source_health"; q "SELECT source, status, last_attempt_ts, last_success_ts, last_observation_ts, last_error, coverage, details_json, updated_ts FROM event_source_health ORDER BY source" | jq -c '.[] | .details = (.details_json | fromjson) | del(.details_json)'
          echo "--- event_observations by source/series"; q "SELECT source, series, COUNT(*) n, MIN(bucket_ts) min_bucket, MAX(bucket_ts) max_bucket, GROUP_CONCAT(DISTINCT coverage) coverage, MIN(observed_ts) min_obs, MAX(observed_ts) max_obs FROM event_observations GROUP BY source, series ORDER BY source, series" | jq -c '.[]'
          echo "--- event_ledger"; q "SELECT event_id, event_type, source, asset, severity, direction, confidence, source_ts, detected_ts, rule_id, rule_version, status, observed_value, threshold_value, substr(explanation,1,240) explanation, source_url, length(evidence_json) evidence_len FROM event_ledger ORDER BY detected_ts" | jq -c '.[]'
          echo "--- event_documents by source"; q "SELECT source, COUNT(*) n, SUM(findings) findings FROM event_documents GROUP BY source" | jq -c '.[]'
          curl -sS -m 20 "$V2/api/events/health" > h_post.json; echo "--- health"; jq -c '{available, enabled, detectors: [.detectors[] | {id, status, last_success_ts, last_observation_ts, age_ms, stale, last_error}], last_run: (.last_run | if . then {run_id, trigger, started_ts, finished_ts} else null end)}' h_post.json
          curl -sS -m 20 "$V2/api/events?since=0&limit=50" > e_post.json; echo "--- /api/events"; jq -c '{ok, count, events: [.events[]? | {event_id, event_type, source, severity, direction, detected_ts}]}' e_post.json
          q "$V1Q" | tee v1_post.json
          q "$SCHEMA" > schema_post.json; echo "schema objects $(jq length schema_post.json) sha256 $(sha256sum schema_post.json | cut -c1-16)"
          cmp -s schema_pre.json schema_post.json && echo "schema unchanged" || echo "::warning::schema changed"
          endpoints | tee ep_post.txt; freshness | tee fr_post.json
          diff ep_pre.txt ep_post.txt && echo "endpoint status codes unchanged" || echo "::warning::endpoint status codes changed"
          $W deployments list --name pulseworker-v2 --json | jq -c '.[-1] | {id, versions: [.versions[] | {version_id, percentage}]}'
          $W secret list --name pulseworker-v2 --format json | jq -c 'map(.name)'
          # exactly one new run; budgets within limits; no credential text in public outputs
          q "SELECT run_id FROM event_runs ORDER BY started_ts" | jq -r '.[].run_id' > runs_post.txt
          echo "event_runs after: $(tr '\n' ' ' < runs_post.txt)"
          [ "$(wc -l < runs_post.txt)" = "2" ] && [ "$(head -1 runs_post.txt)" = "$PRIOR_RUN" ] || { echo "::error::expected exactly one new run"; exit 1; }
          jq -e '.summary.budget | (.fetches <= .fetch_limit) and (.queries <= .query_limit) and .fetch_limit == 40 and .query_limit == 44' run.json >/dev/null || { echo "::error::budget exceeded or limits changed"; exit 1; }
          if grep -F -q -- "$RUN_TOKEN" run.json h_post.json e_post.json; then echo "::error::run token found in public output"; exit 1; fi
          if grep -E -q 'api_key=[^*&" ]' run.json h_post.json e_post.json; then echo "::error::credential text found in public output"; exit 1; fi
          echo "no credential text in run response, /api/events/health or /api/events"
          a1=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' -X POST "$V2/api/events/run")
          a2=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${RUN_TOKEN}" -H 'X-Event-Trigger: schedule' "$V2/api/events/run")
          echo "post-run auth: no token -> $a1; scheduled trigger while disabled -> $a2"
          [ "$a1" = 401 ] && [ "$a2" = 409 ] || { echo "::error::authorisation gates not as expected after the run"; exit 1; }
          [ "$(q "SELECT COUNT(*) n FROM event_runs" | jq '.[0].n')" = "2" ] || { echo "::error::auth checks created a run"; exit 1; }
          [ "$rc" = 0 ] && [ "$code" = 200 ] && jq -e '.ok == true' run.json >/dev/null || { echo "::error::manual run did not return ok (http $code, curl $rc); evidence above; not retried"; exit 1; }
          echo "STAGE 2 RUN: request completed (see per-detector outcomes above); not retried"
