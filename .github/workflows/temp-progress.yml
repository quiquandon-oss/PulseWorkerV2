name: (temp) Experiments progress check

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Experiments progress queries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          OUT=progress_output.txt
          echo "=== now ===" > $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT datetime('now') as now_utc, CAST(strftime('%s','now') AS INTEGER)*1000 as now_ms" >> $OUT

          echo "=== EXP-002 (anomaly gate, BTC-only) ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, COUNT(*) as n, MAX(ts) as latest_ts FROM selection_decisions_anomaly GROUP BY coin" >> $OUT

          echo "=== EXP-003 (momentum, BTC-only) ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, COUNT(*) as n, MAX(ts) as latest_ts FROM selection_decisions_momentum GROUP BY coin" >> $OUT
          echo "--- Exp3 eligibility progress: resolved p_up_momentum rows for BTC ---" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT horizon_hours, COUNT(*) as n FROM challenger_predictions WHERE coin='BTC' AND p_up_momentum IS NOT NULL AND realized_up IS NOT NULL GROUP BY horizon_hours" >> $OUT

          echo "=== EXP-004 (TimesFM, BTC-only): full detail ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT COUNT(*) as total, SUM(CASE WHEN resolved_ts IS NOT NULL THEN 1 ELSE 0 END) as resolved FROM experiment_4_timesfm" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT id, horizon_hours, ts, direction, predicted_return_pct, actual_return_pct, correct, absolute_error, resolved_ts FROM experiment_4_timesfm ORDER BY id ASC" >> $OUT

      - name: Commit output
        run: |
          git config user.name "progress-check-bot"
          git config user.email "actions@github.com"
          mv progress_output.txt .ai/experiments-progress-output.txt
          git add .ai/experiments-progress-output.txt
          git commit -m "chore(temp): experiments progress output" || echo "nothing to commit"
          git push
