name: (temp) Deep experiment analysis

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deep analysis queries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          OUT=analysis_output.txt
          echo "=== now ===" > $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT datetime('now') as now_utc, CAST(strftime('%s','now') AS INTEGER)*1000 as now_ms" >> $OUT

          echo "=== EXP-002: actual decision content (not just counts) ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT id, coin, horizon_hours, ts, cleared_gate, chosen_variant FROM selection_decisions_anomaly WHERE coin='BTC' ORDER BY ts DESC LIMIT 10" >> $OUT

          echo "=== EXP-003 eligibility trend: resolved p_up_momentum by day ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT horizon_hours, date(ts/1000, 'unixepoch') as day, COUNT(*) as n FROM challenger_predictions WHERE coin='BTC' AND p_up_momentum IS NOT NULL AND realized_up IS NOT NULL GROUP BY horizon_hours, day ORDER BY day ASC" >> $OUT

          echo "=== EXP-004: full detail, all rows ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT id, horizon_hours, ts, direction, predicted_return_pct, actual_return_pct, correct, absolute_error, signed_error, resolved_ts FROM experiment_4_timesfm ORDER BY id ASC" >> $OUT

          echo "=== EXP-004: current production_chosen_variant at each forecast (for future comparison) ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT id, horizon_hours, production_chosen_variant FROM experiment_4_timesfm ORDER BY id ASC" >> $OUT

      - name: Commit output
        run: |
          git config user.name "deep-analysis-bot"
          git config user.email "actions@github.com"
          mv analysis_output.txt .ai/deep-experiment-analysis-output.txt
          git add .ai/deep-experiment-analysis-output.txt
          git commit -m "chore(temp): deep experiment analysis output" || echo "nothing to commit"
          git push
