name: Deploy Stage 7 Staging Worker

# Manual, one-shot deploy of the Stage 7 STAGING Worker
# (pulseworker-v2-staging) from claude/stage7-research-pipeline's own
# worker.js + wrangler.staging.toml. This is the ONLY workflow in this
# repo that deploys anything to the staging environment; production
# deployment stays exclusively in .github/workflows/deploy.yml (push to
# main, production wrangler.toml, the general CLOUDFLARE_API_TOKEN
# secret) -- this file never touches, triggers, or substitutes for that
# path.
#
# Isolation, mirroring the same discipline stage7-research-pipeline.yml
# already applies to the D1 side:
#   - workflow_dispatch ONLY -- no push, no schedule. A staging Worker
#     deploy is a deliberate, manual action, never a side effect of any
#     commit landing on main.
#   - Checks out claude/stage7-research-pipeline pinned to the EXACT
#     commit verified before this workflow was written (see the
#     checkout step below) -- never the moving branch head, so this
#     workflow can never silently deploy code nobody reviewed. Bump the
#     pinned SHA deliberately (a small, explicit diff to this file) when
#     a newer verified commit should be deployed instead.
#   - Reads CLOUDFLARE_API_TOKEN from the DEDICATED
#     STAGE7_STAGING_CLOUDFLARE_API_TOKEN secret only -- never the
#     general-purpose CLOUDFLARE_API_TOKEN secret deploy.yml uses -- and
#     fails closed (before checkout) if it is missing or empty.
#   - Validates wrangler.staging.toml itself, after checkout and before
#     any deploy command, for the exact expected staging Worker name and
#     D1 database id, and explicitly rejects the file if it contains any
#     production identifier -- belt-and-braces on top of the file simply
#     being the right one, in case it is ever edited incorrectly.
#   - Deploys with `wrangler deploy -c wrangler.staging.toml` ONLY --
#     never the bare `wrangler deploy` (which would default to
#     wrangler.toml, production) and never cloudflare/wrangler-action
#     (which does not take a -c flag the same way) -- the -c flag is the
#     one thing standing between this workflow and a production deploy,
#     so it is spelled out explicitly rather than hidden in a reusable
#     action's defaults.
#   - permissions: contents: read -- the least actions/checkout needs
#     for a plain checkout; this workflow never writes to the repo (no
#     git commit/push, unlike stage7-research-pipeline.yml's own
#     publish step), so it needs nothing more.
#   - No `set -x` / shell tracing anywhere, and no step ever echoes an
#     env var that could hold a token to the log -- wrangler's own
#     deploy/secret-put output does not print secret values either.
#
# Also configures the Worker secret STAGE7_ADMIN_TOKEN (the Worker's own
# admin gate for POST /api/research-lab/stage7-register-response) via
# `wrangler secret put`, sourcing its value from the DEDICATED
# STAGE7_STAGING_ADMIN_TOKEN GitHub secret -- distinct from
# STAGE7_STAGING_CLOUDFLARE_API_TOKEN (which authenticates wrangler
# itself, never the value being stored). The value is piped through
# stdin (`printf '%s' "$VALUE" | wrangler secret put ...`) rather than
# passed as a command-line argument or echoed as a standalone log line,
# so it never appears in plaintext in the command, the logs, or any
# file -- and GitHub Actions independently masks the literal value
# anywhere it might otherwise surface. Fails closed (before checkout)
# if STAGE7_STAGING_ADMIN_TOKEN is missing or empty, same as the
# Cloudflare token check. This does NOT trigger the Stage 7 research
# pipeline itself -- that stays a separate, later, explicit step.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      # Fail closed before checkout -- no reason to clone the repo at
      # all if this job can't proceed. Never falls back to
      # secrets.CLOUDFLARE_API_TOKEN (the production deploy token) or
      # any other secret.
      - name: Verify staging Cloudflare token is configured
        env:
          STAGE7_STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$STAGE7_STAGING_CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::STAGE7_STAGING_CLOUDFLARE_API_TOKEN secret is missing or empty. Refusing to deploy without the dedicated staging token -- never falls back to CLOUDFLARE_API_TOKEN (the production deploy token) or any other secret."
            exit 1
          fi
          echo "Staging Cloudflare token is configured."

      # Same fail-closed pattern, for the value that will be written
      # into the Worker's own STAGE7_ADMIN_TOKEN secret. Checked before
      # checkout for the same reason: no point cloning the repo if this
      # job can't finish. Never falls back to any other secret or a
      # placeholder value.
      - name: Verify staging admin token secret is configured
        env:
          STAGE7_STAGING_ADMIN_TOKEN: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: |
          if [ -z "$STAGE7_STAGING_ADMIN_TOKEN" ]; then
            echo "::error::STAGE7_STAGING_ADMIN_TOKEN secret is missing or empty. Refusing to configure the Worker's admin secret without it."
            exit 1
          fi
          echo "Staging admin token secret is configured."

      # Pinned to the exact commit verified before this workflow was
      # authored -- see this file's own module comment above. Update
      # this SHA deliberately (its own small commit) to deploy a newer,
      # separately-verified commit; never point this at a mutable branch
      # ref for a deploy workflow.
      - name: Checkout claude/stage7-research-pipeline at the verified commit
        uses: actions/checkout@v4
        with:
          ref: 423ed051dbbb4e230bf6ea832f8c20ead591466f

      # Belt-and-braces: confirm the checked-out wrangler.staging.toml
      # still targets exactly the staging Worker/D1 pair, and contains no
      # production identifier as an ACTUAL config line, BEFORE any
      # deploy command runs. Matched with ^key = "value" (anchored,
      # exact), never a bare substring search -- this file's own
      # comments legitimately name production's "pulseworker-v2" and
      # "sentiment-history" by contrast (see its header), which a plain
      # substring grep would misfire on.
      - name: Validate wrangler.staging.toml targets only the staging Worker and D1 database
        run: |
          set -e
          if ! grep -qx 'name = "pulseworker-v2-staging"' wrangler.staging.toml; then
            echo "::error::wrangler.staging.toml does not declare the expected staging Worker name (pulseworker-v2-staging). Refusing to deploy."
            exit 1
          fi
          if ! grep -qx 'database_id = "5458d504-2778-49ae-bd25-7751f1c49d50"' wrangler.staging.toml; then
            echo "::error::wrangler.staging.toml does not bind the expected staging D1 database id (5458d504-2778-49ae-bd25-7751f1c49d50). Refusing to deploy."
            exit 1
          fi
          if grep -qE '^name = "pulseworker-v2"' wrangler.staging.toml || grep -qE '^database_name = "sentiment-history"' wrangler.staging.toml || grep -qE '^database_id = "f91ca980-b886-423a-bd6f-f3baea46d181"' wrangler.staging.toml; then
            echo "::error::wrangler.staging.toml declares a production Worker/database identifier as a real config line. Refusing to deploy."
            exit 1
          fi
          echo "wrangler.staging.toml target validated: pulseworker-v2-staging / 5458d504-2778-49ae-bd25-7751f1c49d50."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # worker.js is the actual artifact this workflow deploys -- its
      # own vitest suite is what's relevant here, not the separate
      # stage7-research-pipeline/run_stage7.py script (which this
      # workflow never touches and has its own dedicated workflow/tests).
      - name: Run tests (worker.js is what this workflow deploys)
        run: npm test

      - name: Install wrangler
        run: npm install -g wrangler

      # The -c flag is what makes this a staging deploy at all -- never
      # omit it, never point it at wrangler.toml.
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy -c wrangler.staging.toml

      # `wrangler secret put` requires the Worker to already exist --
      # this step runs after (never before) the deploy step above.
      # STAGE7_ADMIN_TOKEN_VALUE is a plain shell variable, scoped to
      # this one step only, holding the value read from the
      # STAGE7_STAGING_ADMIN_TOKEN GitHub secret; it is fed to wrangler
      # via stdin (printf, piped -- never a command-line argument, never
      # echoed as a standalone log line, never written to a file). -c
      # wrangler.staging.toml is what scopes this to the staging Worker
      # specifically -- same as the deploy step, never the production
      # config. CLOUDFLARE_API_TOKEN here is still the dedicated staging
      # token, same as above -- never the general-purpose one.
      - name: Configure STAGE7_ADMIN_TOKEN on the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
          STAGE7_ADMIN_TOKEN_VALUE: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: |
          printf '%s' "$STAGE7_ADMIN_TOKEN_VALUE" | npx wrangler secret put STAGE7_ADMIN_TOKEN -c wrangler.staging.toml
          echo "STAGE7_ADMIN_TOKEN configured on pulseworker-v2-staging."
