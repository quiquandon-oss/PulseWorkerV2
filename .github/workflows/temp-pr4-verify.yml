name: (temp) PR4 small live verification

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Run small live verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 verify_pr4_live.py > verify_output.txt 2>&1 || echo "EXIT=$?" >> verify_output.txt
      - name: Commit output
        run: |
          git config user.name "pr4-verify-bot"
          git config user.email "actions@github.com"
          git add verify_output.txt
          git commit -m "chore(temp): PR4 small live verification output" || echo "nothing to commit"
          git push
