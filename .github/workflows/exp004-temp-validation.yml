name: (temp) Exp4 migration + cadence check

# Temporary, one-off validation workflow -- applies the Experiment 4 D1
# migration and reports btc_data's real observed sampling cadence,
# needed to verify (not assume) that horizon_steps in run_experiment.py
# correctly corresponds to 12h/24h given the actual data, not an
# idealized 3h-exactly assumption. Will be removed once validation is
# complete -- this is not part of the permanent Experiment 4 pipeline.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Apply Experiment 4 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler d1 execute sentiment-history --remote --command "CREATE TABLE IF NOT EXISTS experiment_4_timesfm (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            coin TEXT NOT NULL,
            horizon_hours INTEGER NOT NULL,
            ts INTEGER NOT NULL,
            target_ts INTEGER NOT NULL,
            input_end_ts INTEGER NOT NULL,
            price_at_prediction REAL NOT NULL,
            forecast_price REAL,
            predicted_return_pct REAL,
            direction TEXT,
            model_version TEXT NOT NULL,
            checkpoint TEXT NOT NULL,
            inference_backend TEXT NOT NULL,
            context_length INTEGER NOT NULL,
            features_used TEXT NOT NULL,
            production_chosen_variant TEXT,
            actual_return_pct REAL,
            actual_direction TEXT,
            correct INTEGER,
            absolute_error REAL,
            signed_error REAL,
            resolved_ts INTEGER
          )"
          wrangler d1 execute sentiment-history --remote --command "CREATE INDEX IF NOT EXISTS idx_experiment_4_timesfm_unresolved ON experiment_4_timesfm(target_ts) WHERE resolved_ts IS NULL"
          wrangler d1 execute sentiment-history --remote --command "CREATE INDEX IF NOT EXISTS idx_experiment_4_timesfm_coin_horizon_ts ON experiment_4_timesfm(coin, horizon_hours, ts)"

      - name: Verify table and indexes exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== sqlite_master check ===" >> validation_output.txt
          wrangler d1 execute sentiment-history --remote --command "SELECT type, name, tbl_name FROM sqlite_master WHERE name LIKE '%experiment_4%'" >> validation_output.txt

      - name: Real btc_data cadence -- last rows, raw timestamps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== total btc_data row count ===" >> validation_output.txt
          wrangler d1 execute sentiment-history --remote --command "SELECT COUNT(*) as n FROM btc_data" >> validation_output.txt
          echo "=== last 40 distinct timestamps (raw) ===" >> validation_output.txt
          wrangler d1 execute sentiment-history --remote --command "SELECT DISTINCT ts FROM btc_data ORDER BY ts DESC LIMIT 40" >> validation_output.txt

      - name: Commit output for retrieval
        run: |
          git config user.name "exp4-validation-bot"
          git config user.email "actions@github.com"
          mkdir -p .ai
          mv validation_output.txt .ai/exp004-validation-output.txt
          git add .ai/exp004-validation-output.txt
          git commit -m "chore(temp): exp4 validation output" || echo "nothing to commit"
          git push
