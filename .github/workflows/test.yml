name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: 'Manual job to run in addition to the tests (staging only)'
        required: false
        default: none
        type: choice
        options: [none, staging-deploy-learning]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Only pytest (+ PyYAML) -- NOT torch/timesfm. exp004-timesfm/
      # run_experiment.py imports those lazily, inside generate_forecasts()
      # itself, specifically so this test suite (scope/data-integrity/
      # model-integrity/production-isolation/failure-handling checks) can
      # run in every CI job without needing the real, large ML
      # dependencies installed just to verify the surrounding logic.
      # PyYAML added for research/test_stage7_scheduler_isolation.py's
      # own static parsing of .github/workflows/*.yml -- ubuntu-latest's
      # system Python does NOT ship PyYAML by default (unlike some local
      # dev environments), confirmed by this exact step failing with
      # "No module named 'yaml'" before this line was added.
      - name: Install pytest
        run: pip install pytest pyyaml --break-system-packages
      - name: Run Experiment 4 and research schema tests
        run: python3 -m pytest exp004-timesfm/ research/ -v

  # STAGING ONLY, manual only: deploys this branch's worker.js to pulseworker-v2-staging and sets its
  # STAGE7_ADMIN_TOKEN. Runs only when a human dispatches Test with job=staging-deploy-learning; never on push or PR.
  # Uses only the dedicated STAGE7_STAGING_* secrets (never the production CLOUDFLARE_API_TOKEN) and only
  # wrangler.staging.toml, which binds the staging D1 database 5458d504-.... Guarded by tests/learning-loop.test.js.
  staging-deploy-learning:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'staging-deploy-learning'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the dedicated staging secrets (values never printed)
        env:
          STAGING_CF: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
          STAGING_ADMIN: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: |
          [ -n "$STAGING_CF" ] || { echo "::error::STAGE7_STAGING_CLOUDFLARE_API_TOKEN missing. No fallback."; exit 1; }
          [ -n "$STAGING_ADMIN" ] || { echo "::error::STAGE7_STAGING_ADMIN_TOKEN missing. No fallback."; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the target is staging only
        run: |
          set -e
          grep -qx 'name = "pulseworker-v2-staging"' wrangler.staging.toml
          grep -qx 'database_id = "5458d504-2778-49ae-bd25-7751f1c49d50"' wrangler.staging.toml
          if grep -qE '^(name = "pulseworker-v2"|database_name = "sentiment-history"|database_id = "f91ca980-b886-423a-bd6f-f3baea46d181")' wrangler.staging.toml; then
            echo "::error::wrangler.staging.toml names a production target"; exit 1
          fi
          if grep -qE '^\[triggers\]|^crons' wrangler.staging.toml; then echo "::error::staging config must not define cron triggers"; exit 1; fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to pulseworker-v2-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy -c wrangler.staging.toml --var GIT_COMMIT_SHA:${{ github.sha }}
      - name: Set STAGE7_ADMIN_TOKEN on the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
          ADMIN_VALUE: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: printf '%s' "$ADMIN_VALUE" | npx --yes wrangler@4 secret put STAGE7_ADMIN_TOKEN -c wrangler.staging.toml
      - name: Smoke-check the deployed staging Research Lab (read-only GETs)
        run: |
          set -e
          base=https://pulseworker-v2-staging.quiquandon.workers.dev
          curl -fsS "$base/research-lab" | grep -q '<title>CryptoPulse Research</title>'
          curl -fsS "$base/api/learning/market" | grep -q '"ok":true'
          curl -fsS "$base/api/learning/versions" | grep -q '"available":true'
          echo "staging Research Lab is live at $base/research-lab"
