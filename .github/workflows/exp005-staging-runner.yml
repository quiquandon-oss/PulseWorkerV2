name: Experiment 5 - STAGING runner (manual only)

# Runs research/experiment5_pipeline.py against the STAGING D1 database only, through
# experiment5-staging-runner/run_staging.py. Separate from the production path
# (live-evidence-collection.yml -> scripts/experiment5-agent/run.py), which this workflow neither
# calls nor changes.
#
# Manual only: no schedule, no push/pull_request trigger. Read-only repository permissions; it
# cannot commit, push, or dispatch any other workflow.
#
# Credential: the dedicated staging Cloudflare token (STAGE7_STAGING_CLOUDFLARE_API_TOKEN), passed
# under the runner's own EXP5_STAGING_CLOUDFLARE_API_TOKEN name. The production CLOUDFLARE_API_TOKEN
# is never referenced; the runner also refuses to fall back to it.
#
# The staging target is pinned here AND in run_staging.py, which validates the exact
# (account, name, id) triple and then asks Cloudflare to confirm the database's identity before any
# SQL. Dispatching on a commit other than the one you reviewed is refused by the expected_sha check.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character commit SHA you reviewed. Must equal the dispatched ref head.'
        required: true
        type: string

concurrency:
  group: exp005-staging-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the staging token is configured
        env:
          EXP5_STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$EXP5_STAGING_CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::STAGE7_STAGING_CLOUDFLARE_API_TOKEN is missing or empty. Refusing to run -- there is no fallback to any other credential."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the head is the reviewed commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected_sha must be a full 40-character lowercase commit SHA."
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Dispatched head $HEAD_SHA is not the reviewed commit $EXPECTED_SHA."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest pyyaml --break-system-packages

      - name: Run research/ and runner tests (never run against staging on red tests)
        run: python3 -m pytest research/ experiment5-staging-runner/ -q

      - name: Run Experiment 5 pipeline against STAGING
        env:
          EXP5_STAGING_AUTH_MODE: token
          EXP5_STAGING_ACCOUNT_ID: f58e761fbc8e62dc404d8684290af264
          EXP5_STAGING_DATABASE_NAME: pulseworker-v2-staging
          EXP5_STAGING_DATABASE_ID: 5458d504-2778-49ae-bd25-7751f1c49d50
          EXP5_STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
        run: python3 experiment5-staging-runner/run_staging.py
