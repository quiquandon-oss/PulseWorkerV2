name: Stage 7 - AI-Assisted Research & Full-Source Sentiment Recalculation

# Stage 7 of the Research Lab pipeline: for each real-world event Stage 6
# (live-evidence-collection.yml + event_source_relevance.py/event_source_
# evidence_join.py, all UNCHANGED here) still considers live, this either
# (a) recalculates the event's sentiment over the COMPLETE eligible source
# set when evidence is already sufficient, or (b) publishes a structured
# research request -- as a versioned file in this repo, via a plain git
# commit -- for Olivier to investigate manually with an AI tool's real
# internet-search capability.
#
# Does NOT call any AI API and does NOT perform its own internet search --
# see stage7-research-pipeline/run_stage7.py's own module docstring and
# research/stage7_github_publisher.py. A human registers a completed AI
# response separately via the Worker's POST /api/research-lab/stage7-
# register-response endpoint; this workflow only reads VALIDATED responses
# to decide whether a pending request is now resolved.
#
# All new sentiment/sufficiency/publishing logic lives in, and is unit-
# tested in, research/stage7_evidence_sufficiency.py, research/stage7_
# sentiment_recalculation.py, and research/stage7_github_publisher.py --
# each independently, with zero DB/network dependency. This workflow only
# wires that logic to real D1 (same dual wrangler-CLI-read + Cloudflare
# D1 REST-API-write pattern exp009-event-source-evidence.yml already
# uses) and to a real git commit/push for the request file.
#
# Writes ONLY stage7_research_requests and stage7_event_sentiment (both
# new, migration 0016 -- NOT yet applied to production D1 as of this
# workflow's creation). run_stage7.py checks for that schema FIRST, before
# touching either table: if migration 0016 has not been applied at all, it
# prints {"status": "SKIPPED -- MIGRATION NOT APPLIED", ...} and exits 0
# (a clean, green, no-op run -- never a daily red X while waiting on a
# deliberate, separate migration-application step). A genuinely PARTIAL
# schema (some but not all of the three Stage 7 tables present) or any
# other real D1/read error still fails the job loudly, exactly as before --
# only the single, verified "migration not applied yet" case is quiet.
# See stage7-research-pipeline/run_stage7.py's own classify_stage7_schema_
# state() for the exact rule. Never writes research_events, research_
# event_evidence, history, btc_data, predictions, or any other V1/V2
# production table. stage7_research_responses is written only by a human
# via the Worker endpoint above, never by this script.
#
# ACTIVATION SEQUENCE (manual, deliberate -- never automatic):
#   1. Review and apply .ai/migrations/0016_stage7_research_pipeline.sql
#      to production D1 (`wrangler d1 execute sentiment-history --remote
#      --file .ai/migrations/0016_stage7_research_pipeline.sql`).
#   2. Set the STAGE7_ADMIN_TOKEN Worker secret (`wrangler secret put
#      STAGE7_ADMIN_TOKEN`) -- required before POST /api/research-lab/
#      stage7-register-response will accept any request; see that
#      endpoint's own comment in worker.js.
#   3. Deploy worker.js (this repo's existing deploy.yml, triggered by a
#      push to main that touches worker.js).
#   4. This workflow's next scheduled or manually-dispatched run will then
#      see schema_state == "READY" and process events normally.
# Until step 1 is done, every run of this workflow is a safe, intentional
# no-op.
#
# Daily rather than weekly (unlike exp009/EXP-005): Stage 6 evidence
# changes every 6 hours (live-evidence-collection.yml), so a new event
# can become SUFFICIENT, or a pending request can be resolved by a
# VALIDATED response, well within a week -- a daily check keeps Olivier's
# request queue and event sentiment reasonably current without adding a
# new Cloudflare Cron Trigger (GitHub Actions `schedule:` only, same $0
# reasoning as every other experiment workflow in this repo). Offset one
# hour after live-evidence-collection's own day-boundary run and one hour
# after exp009's Monday run, purely to avoid two large jobs starting at
# the same instant -- Stage 7 is otherwise fully independent of both.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: stage7-research-pipeline
  cancel-in-progress: false

# contents: write (unlike every read-only research workflow in this repo)
# because publish_request_file() commits a new file under research/
# stage7_requests/ via plain git -- the same ambient-GITHUB_TOKEN
# checkout/commit/push pattern proven for automated commits elsewhere,
# never a new PAT, never Octokit.
permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest --break-system-packages

      - name: Run research/ and stage7-research-pipeline/ tests (never run this pipeline against production on red tests)
        run: python3 -m pytest research/ stage7-research-pipeline/ -v

      # publish_request_file() shells out to `git commit`, which requires
      # a configured identity -- the standard github-actions[bot] identity,
      # scoped to this job only (never a user's own git config).
      - name: Configure git identity for automated request commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Stage 7 research + recalculation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 stage7-research-pipeline/run_stage7.py
