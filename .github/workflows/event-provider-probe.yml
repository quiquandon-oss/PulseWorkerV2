# Throwaway: read-only reachability probe of Event Detection providers from a GitHub-hosted runner.
# Runs only on a push to this branch. No secrets, no writes; prints HTTP status, size and a key field only.
name: event-provider-probe
on:
  push:
    branches: [claude/epic-planck-uyapsw-provider-probe]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public endpoints
        run: |
          probe() {
            local name="$1" url="$2"; shift 2
            local code size
            read -r code size < <(curl -sS -o body.bin -w '%{http_code} %{size_download}\n' --max-time 20 "$@" "$url" || echo "000 0")
            local head; head=$(head -c 160 body.bin | tr -d '\n\r' | sed 's/[^[:print:]]//g')
            echo "PROBE|$name|$code|$size|$head"
          }
          now=$(($(date +%s)*1000)); start=$((now-86400000))
          echo "runner: $(curl -sS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(colo|loc)=' | tr '\n' ' ')"
          probe okx_instruments "https://www.okx.com/api/v5/public/instruments?instType=SWAP&instId=BTC-USDT-SWAP"
          probe okx_liquidations "https://www.okx.com/api/v5/public/liquidation-orders?instType=SWAP&instFamily=BTC-USDT&state=filled&limit=100"
          probe deribit_dvol "https://www.deribit.com/api/v2/public/get_volatility_index_data?currency=BTC&start_timestamp=$start&end_timestamp=$now&resolution=3600"
          probe deribit_book "https://www.deribit.com/api/v2/public/get_book_summary_by_currency?currency=BTC&kind=option"
          probe fred_csv_dgs2 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS2&cosd=$(date -u -d '-30 days' +%F)"
          probe fred_csv_dgs10 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=$(date -u -d '-30 days' +%F)"
          probe sec_submissions_nocontact_ua "https://data.sec.gov/submissions/CIK0001050446.json" -A "CryptoPulse provider probe"
          probe binance_fapi "https://fapi.binance.com/fapi/v1/ping"
