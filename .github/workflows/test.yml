name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Only pytest (+ PyYAML) -- NOT torch/timesfm. exp004-timesfm/
      # run_experiment.py imports those lazily, inside generate_forecasts()
      # itself, specifically so this test suite (scope/data-integrity/
      # model-integrity/production-isolation/failure-handling checks) can
      # run in every CI job without needing the real, large ML
      # dependencies installed just to verify the surrounding logic.
      # PyYAML added for research/test_stage7_scheduler_isolation.py's
      # own static parsing of .github/workflows/*.yml -- ubuntu-latest's
      # system Python does NOT ship PyYAML by default (unlike some local
      # dev environments), confirmed by this exact step failing with
      # "No module named 'yaml'" before this line was added.
      - name: Install pytest
        run: pip install pytest pyyaml --break-system-packages
      # stage7-research-pipeline/ added: its tests (workflow branch/SHA binding, the Worker<->migration schema
      # contract run in real sqlite, write boundaries, run_stage7 behaviour) are what protect the Stage 7
      # deployment boundary, so they must gate every PR rather than only run inside the Stage 7 workflow itself.
      - name: Run Experiment 4, research schema and Stage 7 pipeline tests
        run: python3 -m pytest exp004-timesfm/ research/ stage7-research-pipeline/ -v
