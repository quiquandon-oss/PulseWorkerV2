# Stage 7 staging configuration -- NOT used by any production path.
#
# Never referenced by .github/workflows/deploy.yml (which only ever
# targets wrangler.toml, no -c flag) or by any other existing workflow --
# this file has to be passed explicitly via `wrangler <cmd> -c
# wrangler.staging.toml` / `--config wrangler.staging.toml` for anything
# to happen with it at all. Deploys a SEPARATE Worker
# ("pulseworker-v2-staging", distinct from production's "pulseworker-v2")
# bound EXCLUSIVELY to a SEPARATE, newly-created D1 database
# ("pulseworker-v2-staging", distinct from production's
# "sentiment-history") -- see the binding below. Reuses the same
# worker.js source (so Stage 7's real code is what's actually being
# tested) but deliberately omits:
#   - AI use -- the [ai] binding below exists only so a later, reviewed
#     change can enable GLM; with SENTIMENT_V2_AI_MODEL empty and
#     SENTIMENT_V2_AI_DAILY_CALLS "0" the Worker never calls it.
#   - [triggers] (Cloudflare Cron Triggers) -- this account's 5-per-
#     account Free-plan budget is already fully committed to V1+V2
#     production; Stage 7's own scheduling is GitHub Actions' `schedule:`
#     (stage7-research-pipeline.yml), which needs no Cloudflare cron at
#     all. Deploying with zero triggers here costs nothing against that
#     budget.
#   - [observability.*] -- production-tuned dashboard-linked settings,
#     not needed for a throwaway staging deployment.
# GEMINI_API_KEY is intentionally not set here either -- no Gemini/V1/V2
# route is exercised against this staging Worker; only the Stage 7
# endpoints are.
name = "pulseworker-v2-staging"
main = "worker.js"
compatibility_date = "2024-11-01"
account_id = "f58e761fbc8e62dc404d8684290af264"

[ai]
binding = "AI"

[vars]
GIT_COMMIT_SHA = "staging"
# Sentiment V2 staging verification. The V2 cycle and the independent evidence collector (RSS/Atom/official feeds only,
# bounded per run; no paid provider) are enabled. worker.js sv2RunAi calls the AI binding only when SENTIMENT_V2_AI_MODEL is
# non-empty AND SV2_GLM_DAILY_NEURONS is above 0. The free 10,000 Neurons/day are shared with production and V1.
SENTIMENT_V2_ENABLED = "1"
SV2_COLLECTOR_ENABLED = "1"
# GLM IS ENABLED ON STAGING (2026-11-15), bounded: every Workers AI call goes through the reservation ledger, capped at
# 200 Neurons per UTC day in total (2% of the account's free 10,000; one call reserves about 50, so at most 3 calls/day).
# Two paths can spend it: the owner-run glm_probe step, and a manual sync,v2 run when the staging archive has eligible
# V1 observations (none today: staging has no V1 history). Both share the same 200-Neuron cap. The account is on Workers
# Free (owner-confirmed): beyond the free allocation Workers AI returns error 3036 and nothing is billed.
# Production keeps GLM off (empty model, budget 0).
SENTIMENT_V2_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
SV2_GLM_DAILY_NEURONS = "200"
# Staging has no Cron Trigger, so d1_usage_daily gets few records: the collector's usage guard skips only its
# record-age check here (thresholds and the recording-off check still apply). Never set this in production.
SV2_USAGE_GUARD_REQUIRE_FRESH = "0"
# Same source exclusion as production: the feed redirects to plain http.
SV2_SOURCES_DISABLED = "bitcoinmagazine"
# GLM evidence intelligence (glm/runner.js): same switches as production. Inference stays off on staging too: the
# Neuron allocation is account-wide and V1's use is not yet measured. The tick hook is on (staging has no cron).
GLM_SIGNAL_ENABLED = "1"
GLM_INFERENCE_ENABLED = "0"
GLM_TICK_HOOK_ENABLED = "1"
GLM_INFLUENCE_CAP = "0"

# The ONLY D1 binding in this file -- a brand-new, empty database created
# specifically for this staging deployment. Binding name "DB" matches
# exactly what worker.js's own code expects (env.DB.prepare(...)
# throughout) -- this is the one thing that MUST match production's own
# binding name for the same code to work against a different database.
[[d1_databases]]
binding = "DB"
database_name = "pulseworker-v2-staging"
database_id = "5458d504-2778-49ae-bd25-7751f1c49d50"
