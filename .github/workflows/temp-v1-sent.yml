name: (temp) V1 sentiment incremental value check

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy scikit-learn --break-system-packages --quiet
      - run: cd v1-sent-temp && python3 incremental.py > output.txt 2>&1 || true
      - run: |
          git config user.name "v1-sent-bot"
          git config user.email "actions@github.com"
          git add v1-sent-temp/output.txt
          git commit -m "chore(temp): incremental value output" || echo "nothing to commit"
          git push
