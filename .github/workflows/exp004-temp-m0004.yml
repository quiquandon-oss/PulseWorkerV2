name: (temp) Apply Exp4 migration 0004 + verify

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Check current rows and verify target_ts anchor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== current rows ===" > m0004_output.txt
          wrangler d1 execute sentiment-history --remote --command "SELECT id, coin, horizon_hours, ts, target_ts, input_end_ts, (target_ts - input_end_ts) as target_minus_input_end, (target_ts - ts) as target_minus_ts, forecast_horizon_steps, context_length FROM experiment_4_timesfm ORDER BY id ASC" >> m0004_output.txt

      - name: Commit output
        run: |
          git config user.name "exp4-validation-bot"
          git config user.email "actions@github.com"
          git pull
          mv m0004_output.txt .ai/exp004-m0004-output.txt
          git add .ai/exp004-m0004-output.txt
          git commit -m "chore(temp): verify target_ts anchor fix" || echo "nothing to commit"
          git push
