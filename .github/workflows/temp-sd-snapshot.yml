name: (temp) selection_decisions snapshot

on:
  workflow_dispatch:
    inputs:
      label:
        required: true
        type: string

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Snapshot selection_decisions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          OUT=snapshot_${{ inputs.label }}.txt
          echo "=== label: ${{ inputs.label }} ===" > $OUT
          echo "=== now ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT datetime('now') as now_utc, CAST(strftime('%s','now') AS INTEGER)*1000 as now_ms" >> $OUT
          echo "=== full row count + hash-like fingerprint (count, max id, max ts) ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT COUNT(*) as total_rows, MAX(id) as max_id, MAX(ts) as max_ts FROM selection_decisions" >> $OUT
          echo "=== per coin/horizon: latest row id + ts + chosen_variant ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, horizon_hours, MAX(id) as latest_id, MAX(ts) as latest_ts FROM selection_decisions GROUP BY coin, horizon_hours ORDER BY coin, horizon_hours" >> $OUT
          echo "=== exact latest BTC rows (id, ts, chosen_variant) -- the specific rows EXP-004 reads at prediction time ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT id, horizon_hours, ts, chosen_variant FROM selection_decisions WHERE coin='BTC' ORDER BY ts DESC LIMIT 4" >> $OUT

      - name: Commit output
        run: |
          git config user.name "exp4-isolation-proof-bot"
          git config user.email "actions@github.com"
          git pull
          mv snapshot_${{ inputs.label }}.txt .ai/selection-decisions-snapshot-${{ inputs.label }}.txt
          git add .ai/selection-decisions-snapshot-${{ inputs.label }}.txt
          git commit -m "chore(temp): selection_decisions snapshot (${{ inputs.label }})" || echo "nothing to commit"
          git push
