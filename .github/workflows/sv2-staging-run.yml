# Sentiment V2 staging run (manual, staging only). Staging has no Cron Trigger, so this calls the owner-only
# POST /api/sentiment-v2/run on the STAGING Worker with the staging admin token, then reads the public status and
# evidence routes, and prints the JSON results (no secret is ever printed). It deploys nothing, applies no migration
# and has no Cloudflare API token. Production is unreachable from here: the URL is the staging Worker only.
name: Sentiment V2 Staging Run

on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Steps to run on staging (collector limits: 3 sources, 8 subrequests per run)'
        required: true
        default: 'collect'
        type: choice
        options:
          - collect
          - sync,v2
          - sync,v2,collect
          - glm_probe

permissions: {}

concurrency:
  group: sv2-staging
  cancel-in-progress: false

jobs:
  run-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same protected Environment as deploy-sv2-staging.yml: its secrets are available only to runs from main.
    environment: sv2-staging
    steps:
      - name: Refuse anything but main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::dispatch from main only (got $GITHUB_REF)"; exit 1; }
      - name: Run the V2 steps on the staging Worker and read status and evidence
        env:
          STAGING_ADMIN: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
          STEPS: ${{ inputs.steps }}
        run: |
          set -euo pipefail
          [ -n "$STAGING_ADMIN" ] || { echo "::error::STAGE7_STAGING_ADMIN_TOKEN is not set in the sv2-staging environment"; exit 1; }
          BASE=https://pulseworker-v2-staging.quiquandon.workers.dev
          body=$(python3 -c "import json,os;print(json.dumps({'steps':os.environ['STEPS'].split(',')}))")
          code=$(curl -sS -o run.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${STAGING_ADMIN}" \
            -H 'Content-Type: application/json' -d "$body" "$BASE/api/sentiment-v2/run")
          echo "POST /api/sentiment-v2/run -> HTTP $code"
          python3 -m json.tool run.json | head -c 20000
          sleep 2
          # /status is edge-cached for up to 5 min; run.json above is the authoritative result of this run.
          curl -sS -o status.json "$BASE/api/sentiment-v2/status"
          # The evidence route is edge-cached for 5 min per (hours, limit), and the run does not invalidate it. Accept an
          # evidence response only if it was generated after this run (generated_at >= run.json ran_at): try up to 10
          # cache keys (limit 51..100, the panel uses 12) and say so plainly if none is fresh.
          RAN_AT=$(python3 -c "import json;print(json.load(open('run.json')).get('ran_at') or 0)")
          EVIDENCE_FRESH=0
          for i in $(seq 0 9); do
            LIMIT=$(( 51 + ( $(date +%s) + i * 7 ) % 50 ))
            curl -sS -o evidence.json "$BASE/api/sentiment-v2/evidence?hours=24&limit=${LIMIT}"
            if python3 -c "import json,sys;sys.exit(0 if (json.load(open('evidence.json')).get('generated_at') or 0) >= $RAN_AT else 1)"; then EVIDENCE_FRESH=1; break; fi
          done
          export EVIDENCE_FRESH
          python3 - <<'PY'
          import json
          s = json.load(open('status.json'))
          print('STATUS (edge-cached up to 5 min; run.json above is this run) ok=%s health=%s collector_enabled=%s ai_enabled=%s errors=%s' % (s.get('ok'), s.get('health'),
                (s.get('collector') or {}).get('enabled'), (s.get('ai') or {}).get('enabled'), s.get('errors')))
          for src in s.get('sources', []):
              print('  %-16s %-14s attempts=%s reliability=%s fresh=%s err=%s' % (src['id'], src['last_status'], src['attempts'], src['reliability'], src['fresh'], (src.get('last_error') or '')[:80]))
          for r in s.get('runs', [])[:5]:
              print('  run %s seen=%s new=%s dup=%s subrequests=%s bytes=%s errors=%s' % (r['run_ts'], r['items_seen'], r['items_new'], r['items_duplicate'], r['subrequests'], r['bytes'], r['errors']))
          e = json.load(open('evidence.json'))
          import os
          fresh = os.environ.get('EVIDENCE_FRESH') == '1'
          print('EVIDENCE (%s) ok=%s available=%s items=%d' % ('generated after this run' if fresh else 'NOT FRESH: every read was an edge-cached response from before this run',
                e.get('ok'), e.get('available'), len(e.get('items', []))))
          for it in e.get('items', [])[:25]:
              print('  [%s] %+d/%d %s' % (it['source_id'], it.get('lexicon_score', 0), it.get('lexicon_hits', 0), it['title'][:110]))
          PY
          [ "$code" = "200" ] || { echo "::error::staging run returned HTTP $code"; exit 1; }
          # HTTP 200 is not enough: every requested step must have run and reported ok (not skipped, not ok:false).
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open('run.json'))
          bad = [] if r.get('ok') is True else ['run: ok=%s error=%s' % (r.get('ok'), r.get('error'))]
          key = {'sync': 'sync', 'v2': 'v2', 'collect': 'collect', 'glm_probe': 'glm_probe'}
          for step in os.environ['STEPS'].split(','):
              res = r.get(key[step])
              if not isinstance(res, dict): bad.append('%s: no result' % step)
              # The GLM probe reports an AI status, not ok/skipped: only a validated 'ok' answer passes. Its token counts
              # and actual Neurons are in run.json above; one call, never retried, inside the staging Neuron budget.
              elif step == 'glm_probe':
                  if res.get('status') != 'ok': bad.append('glm_probe: status=%s reason=%s' % (res.get('status'), res.get('reason')))
                  # A pass needs MEASURED usage: numeric token counts and actual Neurons from the response (Codex P2).
                  elif not all(isinstance(res.get(k), (int, float)) and not isinstance(res.get(k), bool) for k in ('input_tokens', 'output_tokens', 'actual_neurons')):
                      bad.append('glm_probe: answered without measured usage (input_tokens=%s output_tokens=%s actual_neurons=%s)' % (res.get('input_tokens'), res.get('output_tokens'), res.get('actual_neurons')))
                  else: print('GLM probe ok: model=%s input_tokens=%s output_tokens=%s reserved_neurons=%s actual_neurons=%s' % (res.get('model'), res.get('input_tokens'), res.get('output_tokens'), res.get('reserved_neurons'), res.get('actual_neurons')))
              elif res.get('ok') is not True: bad.append('%s: ok=%s errors=%s' % (step, res.get('ok'), res.get('errors') or res.get('reason')))
              elif res.get('skipped'): bad.append('%s: skipped (%s)' % (step, res.get('reason')))
          if bad:
              for b in bad: print('::error::' + b)
              sys.exit(1)
          print('All requested steps ran and reported ok: ' + os.environ['STEPS'])
          PY
