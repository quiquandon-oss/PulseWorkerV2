name: Experiment 4 - TimesFM Challenger (BTC only, research only)

# BTC-only, per the explicit spec rule: "If Experiment 4 requires a
# separate/dedicated cron, Experiment 4 MUST BE BTC ONLY." It requires
# one here structurally, not by choice -- TimesFM is a PyTorch model
# that cannot execute inside Cloudflare's Worker/global cron at all (no
# Python runtime in a V8 isolate, and the checkpoint alone exceeds any
# Workers memory limit), so "reuse the existing execution cycle" is not
# an available option regardless of coin scope.
#
# This is a completely independent scheduling mechanism from Cloudflare's
# Cron Triggers -- it does not consume any of the account's 5-Cron-
# Trigger-per-account Workers Free budget (see wrangler.toml's own
# comment for that unrelated, already-resolved constraint). Runs once
# daily (not every 3h) -- a deliberately conservative cadence: TimesFM
# inference itself is cheap, but there's no reason to run this more
# often than needed for a research comparison, and public-repo GitHub
# Actions minutes, while unlimited, aren't a reason to be wasteful.
# Offset 30 minutes from the existing 07:00 UTC daily cron to avoid
# coinciding with it, though the two are otherwise unrelated (different
# infrastructure entirely).
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  exp004:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CPU-only torch explicitly -- GitHub-hosted runners have no GPU,
      # and the default `pip install torch` would otherwise pull a much
      # larger CUDA-enabled build for no benefit here.
      # Pinned (2026-11-14) to exactly what the scheduled runs installed (run 43604646261): the timesfm 3.0.2 package
      # loads the TimesFM 2.5 checkpoint google/timesfm-2.5-200m-pytorch (MODEL_VERSION timesfm-2.5-200m). Unpinned, a
      # new timesfm/torch/numpy release could change forecasts mid-experiment without any code change.
      - name: Install TimesFM (CPU, pinned)
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "timesfm[torch]==3.0.2" numpy==2.4.6 huggingface_hub==2.4.0 safetensors==0.8.0

      - name: Run Experiment 4 (forecast + resolve)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: /usr/bin/time -v -o "$RUNNER_TEMP/exp004-time.txt" python exp004-timesfm/run_experiment.py

      # Free-allowance measurement (no effect on the experiment): runner time, peak memory, installed versions and the
      # Hugging Face snapshot actually loaded, in the run's step summary.
      - name: Resource and version report
        if: always()
        run: |
          {
            echo "### EXP-004 resources"
            echo "- peak memory: $(grep 'Maximum resident' "$RUNNER_TEMP/exp004-time.txt" 2>/dev/null | awk '{print $6}') KB"
            echo "- run wall time: $(grep 'Elapsed (wall' "$RUNNER_TEMP/exp004-time.txt" 2>/dev/null | awk '{print $8}')"
            echo "- versions: $(pip freeze 2>/dev/null | grep -iE '^(timesfm|torch|numpy|huggingface.hub|safetensors)==' | tr '\n' ' ')"
            echo "- HF snapshot: $(python -c "from huggingface_hub import scan_cache_dir; print(' '.join(f'{r.repo_id}@{v.commit_hash}' for r in scan_cache_dir().repos for v in r.revisions))" 2>/dev/null)"
            echo "- HF cache size: $(du -sh ~/.cache/huggingface 2>/dev/null | cut -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
