name: (temp) Ecosystem health check

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Comprehensive health check -- production + all experiments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          OUT=health_output.txt
          echo "=== now ===" > $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT datetime('now') as now_utc, CAST(strftime('%s','now') AS INTEGER)*1000 as now_ms" >> $OUT

          echo "=== production: core predictions latest per coin/horizon ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT 'BTC' as coin, horizon_hours, MAX(ts) as latest_ts FROM predictions GROUP BY horizon_hours" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT 'LINK' as coin, horizon_hours, MAX(ts) as latest_ts FROM link_predictions GROUP BY horizon_hours" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT 'ETH' as coin, horizon_hours, MAX(ts) as latest_ts FROM eth_predictions GROUP BY horizon_hours" >> $OUT

          echo "=== production: selection_decisions latest per coin/horizon ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, horizon_hours, MAX(ts) as latest_ts FROM selection_decisions GROUP BY coin, horizon_hours ORDER BY coin, horizon_hours" >> $OUT

          echo "=== production: challenger_predictions latest per coin/horizon ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, horizon_hours, MAX(ts) as latest_ts FROM challenger_predictions GROUP BY coin, horizon_hours ORDER BY coin, horizon_hours" >> $OUT

          echo "=== EXP-002 (anomaly gate, BTC-only): row count + latest ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, COUNT(*) as n, MAX(ts) as latest_ts FROM selection_decisions_anomaly GROUP BY coin" >> $OUT

          echo "=== EXP-003 (momentum, BTC-only): row count + latest ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, COUNT(*) as n, MAX(ts) as latest_ts FROM selection_decisions_momentum GROUP BY coin" >> $OUT

          echo "=== EXP-004 (TimesFM, BTC-only): full status ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT COUNT(*) as total, SUM(CASE WHEN resolved_ts IS NOT NULL THEN 1 ELSE 0 END) as resolved, MIN(ts) as earliest, MAX(ts) as latest FROM experiment_4_timesfm" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT id, horizon_hours, ts, target_ts, direction, predicted_return_pct, actual_return_pct, correct, resolved_ts FROM experiment_4_timesfm ORDER BY id DESC LIMIT 10" >> $OUT

          echo "=== backlog sanity (unresolved, cheap via partial indexes) ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT COUNT(*) as n FROM predictions WHERE realized_up IS NULL AND target_ts <= CAST(strftime('%s','now') AS INTEGER)*1000" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT COUNT(*) as n FROM link_predictions WHERE realized_up IS NULL AND target_ts <= CAST(strftime('%s','now') AS INTEGER)*1000" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT COUNT(*) as n FROM eth_predictions WHERE realized_up IS NULL AND target_ts <= CAST(strftime('%s','now') AS INTEGER)*1000" >> $OUT

      - name: Commit output
        run: |
          git config user.name "health-check-bot"
          git config user.email "actions@github.com"
          mv health_output.txt .ai/ecosystem-health-output.txt
          git add .ai/ecosystem-health-output.txt
          git commit -m "chore(temp): ecosystem health check output" || echo "nothing to commit"
          git push
