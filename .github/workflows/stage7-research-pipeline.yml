name: Stage 7 - AI-Assisted Research & Full-Source Sentiment Recalculation

# Stage 7 of the Research Lab pipeline -- CONFIRMED HUMAN-CONTROLLED
# OPERATING MODEL: a human reviews a batch of proposed candidates in the
# app, explicitly selects which to research, copies the app-generated
# prompt to an external AI, pastes the answer back, and explicitly
# triggers recalculation. This workflow is the BATCH half of that loop --
# the interactive half (browsing candidates, creating requests, pasting
# responses, flagging for recalculation) is entirely in worker.js/D1 and
# needs no workflow run at all. Each dispatch of THIS workflow does, for
# events Stage 6 (live-evidence-collection.yml + event_source_relevance.py/
# event_source_evidence_join.py, all UNCHANGED here) still considers live:
#   (a) PROPOSE -- assess newly-insufficient/conflicting events and write
#       them as stage7_research_candidates rows (status PROPOSED) for a
#       human to review in the app. Never creates a request, never
#       publishes anything.
#   (b) PUBLISH/RETRY -- for a request a human already created via the app
#       (PENDING_RESEARCH, prompt already generated and visible in-app) or
#       whose prior publish failed (FAILED_RETRYABLE), commit the
#       already-generated prompt to this repo as a durable file. This is a
#       best-effort audit trail, never required for the interactive
#       workflow -- the prompt is already copyable from the app regardless.
#   (c) RECALCULATE -- for a response a human has both VALIDATED and
#       explicitly flagged via the app's "Trigger recalculation" action
#       (recalculation_requested_ts set), recompute that event's Stage 7
#       sentiment over the complete eligible source set. Registering or
#       validating a response never queues this on its own.
#
# Does NOT call any AI API and does NOT perform its own internet search --
# see stage7-research-pipeline/run_stage7.py's own module docstring and
# research/stage7_github_publisher.py.
#
# All new sentiment/sufficiency/publishing logic lives in, and is unit-
# tested in, research/stage7_evidence_sufficiency.py, research/stage7_
# sentiment_recalculation.py, and research/stage7_github_publisher.py --
# each independently, with zero DB/network dependency. This workflow only
# wires that logic to real D1 (same dual wrangler-CLI-read + Cloudflare
# D1 REST-API-write pattern exp009-event-source-evidence.yml already
# uses) and to a real git commit/push for the request file.
#
# Writes stage7_research_candidates, stage7_event_sentiment, and (publish/
# retry only) UPDATEs to stage7_research_requests it did not itself create
# (migrations 0016 + 0017 -- NOT yet applied to production D1 as of this
# workflow's creation). It never INSERTs a stage7_research_requests row --
# only the Worker does that, for an explicitly human-selected candidate.
# run_stage7.py checks schema state FIRST, before touching anything: if
# neither migration has been applied at all, it prints
# {"status": "SKIPPED -- MIGRATION NOT APPLIED", ...} and exits 0 (a clean,
# green, no-op run -- never a red X while waiting on a deliberate, separate
# migration-application step). A genuinely PARTIAL schema or any other real
# D1/read error still fails the job loudly, exactly as before -- only the
# single, verified "migration not applied yet" case is quiet. See
# stage7-research-pipeline/run_stage7.py's own classify_stage7_schema_
# state() for the exact rule. Never writes research_events, research_
# event_evidence, history, btc_data, predictions, or any other V1/V2
# production table. stage7_research_responses is written only by a human
# via the Worker's POST /api/research-lab/stage7-register-response
# endpoint, never by this script.
#
# ACTIVATION SEQUENCE (manual, deliberate -- never automatic):
#   1. Review and apply .ai/migrations/0016_stage7_research_pipeline.sql
#      then .ai/migrations/0017_stage7_candidate_workflow.sql to
#      production D1 (`wrangler d1 execute sentiment-history --remote
#      --file <path>`, in that order).
#   2. Set the STAGE7_ADMIN_TOKEN Worker secret (`wrangler secret put
#      STAGE7_ADMIN_TOKEN`) -- required before any of the Stage 7 write
#      endpoints (create-requests, register-response, trigger-
#      recalculation) will accept any request; see worker.js. Stage 7 is
#      also OFF unless the deployment sets the plain var STAGE7_ENABLED =
#      "true" (only wrangler.staging.toml does; production's wrangler.toml
#      never does, so merging worker.js cannot activate Stage 7 there).
#   3. Deploy worker.js (this repo's existing deploy.yml, triggered by a
#      push to main that touches worker.js). This alone makes the
#      interactive candidate-review/request-creation/response-registration/
#      recalculation-trigger workflow usable end to end through the app --
#      it does NOT require this workflow to ever run.
#   4. Separately and explicitly decide whether/when to ever dispatch THIS
#      workflow against production, for the batch propose/publish/
#      recalculate steps above -- that is its own decision, not implied by
#      steps 1-3.
# Until step 1 is done, every run of this workflow is a safe, intentional
# no-op.
#
# STAGING-ONLY, FAIL-CLOSED (Copilot-audit remediation, 2026-09):
# run_stage7.py hardcoded production's OWN D1 database (sentiment-history)
# with no way to point it anywhere else, so this workflow -- which used the
# general-purpose CLOUDFLARE_API_TOKEN and could in principle run on main --
# could have silently written to production. Fixed on BOTH sides:
#   - run_stage7.py now has NO default/fallback database target at all; it
#     requires STAGE7_TARGET_ACCOUNT_ID/_DATABASE_NAME/_DATABASE_ID (set
#     below, pointing at the separate pulseworker-v2-staging D1 database)
#     and validates them against that one expected staging target BEFORE
#     any remote D1 call -- see its own validate_staging_target().
#   - This workflow only ever runs against the reviewed
#     claude/stage7-human-controlled-workflow branch AND only for code
#     whose full SHA a human supplies as `expected_sha` (the "Enforce
#     staging-only branch" step and the "Verify the head is the reviewed
#     commit" step below -- the former runs before checkout/tests/anything
#     that could touch Cloudflare or git-push), and uses the DEDICATED
#     STAGE7_STAGING_CLOUDFLARE_API_TOKEN secret rather than the general
#     CLOUDFLARE_API_TOKEN production deploy uses.
# KNOWN LIMITATION (documented, not fixed by scoping alone): Cloudflare's
# D1 Edit/Read API-token permissions are ACCOUNT-WIDE -- there is no
# per-database resource restriction in Cloudflare's permission model as of
# this writing. A token with D1 Edit therefore CAN technically reach
# production's sentiment-history database even when minted "for staging
# only"; a token's name or intended purpose is not itself an access
# control. The isolation this workflow provides is: (a) this script will
# refuse to use such a token against anything but the exact staging
# database id above, and (b) this workflow will not run outside this one
# branch. Minimum permission to grant STAGE7_STAGING_CLOUDFLARE_API_TOKEN:
# Account -> D1 -> Edit, scoped to this one Cloudflare account (no Workers
# Scripts / KV / R2 / other account permissions needed) -- there is
# currently no way to further scope it to only the staging database.
# This workflow, this script, and this comment do NOT create, rotate, or
# reveal any secret; STAGE7_STAGING_CLOUDFLARE_API_TOKEN must be created
# and set by a human with Cloudflare account access, same as every other
# secret in this repo.
#
# NO schedule: TRIGGER HERE, AND NO SCHEDULED DISPATCH EITHER. A `schedule:` trigger is only ever evaluated using
# the workflow file on the repository's DEFAULT branch (main), so one declared here would sit dormant only for as
# long as this file never reaches main. The human-controlled operating model (a person selects candidates,
# validates responses and explicitly requests recalculation; this workflow only executes what they asked for) also
# means a run must be a deliberate human act. The former daily dispatcher
# (.github/workflows/stage7-staging-dispatcher.yml) fired this workflow on a different branch, so unreviewed code
# kept running against staging; it is now manual-only and must be given the reviewed SHA. A run is bound to
# reviewed code twice: the ref must be exactly refs/heads/claude/stage7-human-controlled-workflow, and a human
# supplies `expected_sha`, which must be an ancestor of the checked-out head with nothing but publisher data
# (research/stage7_requests/**) committed after it.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full 40-character commit SHA of the reviewed code this run is allowed to execute (see "Enforce staging-only branch" below).'
        required: true
        type: string

concurrency:
  group: stage7-research-pipeline
  cancel-in-progress: false

# contents: write (unlike every read-only research workflow in this repo)
# because publish_request_file() commits a new file under research/
# stage7_requests/ via plain git -- the same ambient-GITHUB_TOKEN
# checkout/commit/push pattern proven for automated commits elsewhere,
# never a new PAT, never Octokit.
permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      # MUST be the first step -- runs before checkout, before tests,
      # before anything that could touch Cloudflare or publish a git
      # commit. `github.ref` is compared for EXACT equality against
      # refs/heads/claude/stage7-research-pipeline; any other ref (main,
      # a PR merge ref, a tag, a different branch) aborts the job here.
      # This workflow now has ONLY workflow_dispatch as a trigger (no
      # schedule: -- see the module comment above and .github/workflows/
      # stage7-staging-dispatcher.yml on main, which fires this event
      # daily with ref=claude/stage7-research-pipeline), but the guard
      # stays regardless: it is what keeps a manual dispatch, or this
      # file ever being merged to main, from running against anything
      # but this one staging branch.
      - name: Enforce staging-only branch
        env:
          DISPATCH_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/claude/stage7-human-controlled-workflow" ]; then
            echo "::error::Stage 7 is staging-only. Refusing to run on ref '$DISPATCH_REF' -- this workflow may only execute on refs/heads/claude/stage7-human-controlled-workflow. Aborting before checkout, tests, Cloudflare access, or any git publish step."
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected_sha must be a full 40-character lowercase commit SHA. Aborting before checkout, tests, Cloudflare access, or any git publish step."
            exit 1
          fi
          echo "Branch guard passed: $DISPATCH_REF (reviewed SHA to be verified after checkout: $EXPECTED_SHA)."

      # Fail closed, not silently skip, if the dedicated staging token
      # isn't configured -- a missing secret must never be mistaken for
      # "nothing to do" (that path is schema_state == NOT_APPLIED,
      # handled inside run_stage7.py itself). Checked before checkout:
      # no reason to even clone the repo if this job can't proceed.
      - name: Verify staging Cloudflare token is configured
        env:
          STAGE7_STAGING_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$STAGE7_STAGING_CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::STAGE7_STAGING_CLOUDFLARE_API_TOKEN secret is missing or empty. Refusing to run Stage 7 without the dedicated staging token -- never falls back to CLOUDFLARE_API_TOKEN (the production deploy token) or any other secret."
            exit 1
          fi
          echo "Staging Cloudflare token is configured."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The code that runs here must BE the reviewed code: expected_sha must be an ancestor of the checked-out
      # head, and the only paths that may differ since are the request files this pipeline itself publishes
      # (research/stage7_requests/**). Anything else means unreviewed code, so the run aborts before any
      # Cloudflare access or publish step.
      - name: Verify the head is the reviewed commit (only publisher data may follow it)
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -e
          git cat-file -e "$EXPECTED_SHA^{commit}" || { echo "::error::expected_sha $EXPECTED_SHA is not a commit in this repository."; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_SHA" HEAD || { echo "::error::expected_sha is not an ancestor of the dispatched head; the branch was rewritten or the SHA is wrong."; exit 1; }
          unreviewed=$(git diff --name-only "$EXPECTED_SHA" HEAD | grep -v '^research/stage7_requests/' || true)
          if [ -n "$unreviewed" ]; then
            echo "::error::These files changed after the reviewed commit and are not publisher data -- review them and dispatch with the new SHA:"
            echo "$unreviewed"
            exit 1
          fi
          echo "Head $(git rev-parse HEAD) contains reviewed code $EXPECTED_SHA plus, at most, publisher request files."

      - name: Setup Node (for wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyYAML is needed by test_workflow_staging_guard.py's own static
      # parsing of this workflow file -- ubuntu-latest's system Python
      # does not ship it by default (confirmed via a real CI failure,
      # "No module named 'yaml'", on the equivalent install step in
      # .github/workflows/test.yml on main before this line was added).
      - name: Install pytest
        run: pip install pytest pyyaml --break-system-packages

      - name: Run research/ and stage7-research-pipeline/ tests (never run this pipeline against production on red tests)
        run: python3 -m pytest research/ stage7-research-pipeline/ -v

      # publish_request_file() shells out to `git commit`, which requires
      # a configured identity -- the standard github-actions[bot] identity,
      # scoped to this job only (never a user's own git config).
      - name: Configure git identity for automated request commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # CLOUDFLARE_API_TOKEN here is the DEDICATED staging token (never
      # the production CLOUDFLARE_API_TOKEN secret deploy.yml uses) --
      # wrangler and run_stage7.py's own d1_api_query() both read it from
      # this exact env var name. STAGE7_TARGET_* pin the explicit staging
      # account/database that run_stage7.py's validate_staging_target()
      # checks BEFORE any remote D1 access; see that function's own
      # docstring and this file's staging-only-and-fail-closed comment
      # above for what happens if any of these is wrong or missing.
      - name: Run Stage 7 research + recalculation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
          STAGE7_TARGET_ACCOUNT_ID: f58e761fbc8e62dc404d8684290af264
          STAGE7_TARGET_DATABASE_NAME: pulseworker-v2-staging
          STAGE7_TARGET_DATABASE_ID: 5458d504-2778-49ae-bd25-7751f1c49d50
        run: python3 stage7-research-pipeline/run_stage7.py
