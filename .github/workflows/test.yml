name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: 'Manual job to run in addition to the tests (staging only)'
        required: false
        default: none
        type: choice
        options: [none, staging-deploy-learning, staging-session-walkthrough, production-learning-setup, production-session-smoke]
      event_id:
        description: 'staging-session-walkthrough: fresh staging fixture event for the existing-source journey'
        required: false
        default: '999004'
      signal_event_id:
        description: 'staging-session-walkthrough: fresh staging fixture event for the NEW_SIGNAL journey (empty = skip)'
        required: false
        default: ''
      proxy_candidate_id:
        description: 'staging-session-walkthrough: staging copy of a legacy proxy candidate (empty = skip)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Only pytest (+ PyYAML) -- NOT torch/timesfm. exp004-timesfm/
      # run_experiment.py imports those lazily, inside generate_forecasts()
      # itself, specifically so this test suite (scope/data-integrity/
      # model-integrity/production-isolation/failure-handling checks) can
      # run in every CI job without needing the real, large ML
      # dependencies installed just to verify the surrounding logic.
      # PyYAML added for research/test_stage7_scheduler_isolation.py's
      # own static parsing of .github/workflows/*.yml -- ubuntu-latest's
      # system Python does NOT ship PyYAML by default (unlike some local
      # dev environments), confirmed by this exact step failing with
      # "No module named 'yaml'" before this line was added.
      - name: Install pytest
        run: pip install pytest pyyaml --break-system-packages
      - name: Run Experiment 4 and research schema tests
        run: python3 -m pytest exp004-timesfm/ research/ -v

  # STAGING ONLY, manual only: deploys this branch's worker.js to pulseworker-v2-staging and sets its
  # STAGE7_ADMIN_TOKEN. Runs only when a human dispatches Test with job=staging-deploy-learning; never on push or PR.
  # Uses only the dedicated STAGE7_STAGING_* secrets (never the production CLOUDFLARE_API_TOKEN) and only
  # wrangler.staging.toml, which binds the staging D1 database 5458d504-.... Guarded by tests/learning-loop.test.js.
  staging-deploy-learning:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'staging-deploy-learning'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the dedicated staging secrets (values never printed)
        env:
          STAGING_CF: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
          STAGING_ADMIN: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: |
          [ -n "$STAGING_CF" ] || { echo "::error::STAGE7_STAGING_CLOUDFLARE_API_TOKEN missing. No fallback."; exit 1; }
          [ -n "$STAGING_ADMIN" ] || { echo "::error::STAGE7_STAGING_ADMIN_TOKEN missing. No fallback."; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the target is staging only
        run: |
          set -e
          grep -qx 'name = "pulseworker-v2-staging"' wrangler.staging.toml
          grep -qx 'database_id = "5458d504-2778-49ae-bd25-7751f1c49d50"' wrangler.staging.toml
          if grep -qE '^(name = "pulseworker-v2"|database_name = "sentiment-history"|database_id = "f91ca980-b886-423a-bd6f-f3baea46d181")' wrangler.staging.toml; then
            echo "::error::wrangler.staging.toml names a production target"; exit 1
          fi
          if grep -qE '^\[triggers\]|^crons' wrangler.staging.toml; then echo "::error::staging config must not define cron triggers"; exit 1; fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy to pulseworker-v2-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy -c wrangler.staging.toml --var GIT_COMMIT_SHA:${{ github.sha }}
      - name: Set STAGE7_ADMIN_TOKEN on the staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE7_STAGING_CLOUDFLARE_API_TOKEN }}
          ADMIN_VALUE: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: printf '%s' "$ADMIN_VALUE" | npx --yes wrangler@4 secret put STAGE7_ADMIN_TOKEN -c wrangler.staging.toml
      - name: Smoke-check the deployed staging Research Lab (read-only GETs)
        run: |
          set -e
          base=https://pulseworker-v2-staging.quiquandon.workers.dev
          curl -fsS "$base/research-lab" | grep -q '<title>CryptoPulse Research</title>'
          curl -fsS "$base/api/learning/market" | grep -q '"ok":true'
          curl -fsS "$base/api/learning/versions" | grep -q '"available":true'
          echo "staging Research Lab is live at $base/research-lab"

  # STAGING ONLY, manual only (job=staging-session-walkthrough): drives the deployed staging Research Lab in Chromium
  # (sign in once -> full journey -> rejected writes create no rows). Reads the staging admin token from its secret and
  # never prints it. Touches only pulseworker-v2-staging. Guarded by tests/learning-loop.test.js.
  staging-session-walkthrough:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'staging-session-walkthrough'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Walk the staging Research Lab as a signed-in user
        env:
          STAGING_ADMIN_TOKEN: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
          EVENT_ID: ${{ inputs.event_id || '999004' }}
          SIGNAL_EVENT_ID: ${{ inputs.signal_event_id }}
          PROXY_CANDIDATE_ID: ${{ inputs.proxy_candidate_id }}
        run: node tests/e2e/staging-session-walkthrough.cjs

  # PRODUCTION, manual only (job=production-learning-setup): sets ONLY the STAGE7_ADMIN_TOKEN secret on the production
  # Worker pulseworker-v2 (value from STAGE7_STAGING_ADMIN_TOKEN, as authorized) and smoke-checks the live Research
  # Lab with read-only GETs plus one no-write authorization probe. It never deploys code (deploy.yml does that on
  # push to main), never runs D1 commands and never changes V1 weights. Guarded by tests/learning-loop.test.js.
  production-learning-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'production-learning-setup' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the secrets (values never printed)
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: |
          [ -n "$CF" ] || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          [ -n "$ADMIN" ] || { echo "::error::STAGE7_STAGING_ADMIN_TOKEN missing"; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the production Worker name
        run: grep -qx 'name = "pulseworker-v2"' wrangler.toml
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set STAGE7_ADMIN_TOKEN on pulseworker-v2 (secret only, no code deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_VALUE: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: printf '%s' "$ADMIN_VALUE" | npx --yes wrangler@4 secret put STAGE7_ADMIN_TOKEN --name pulseworker-v2
      - name: Smoke-check the production Research Lab (read-only GETs + one no-write auth probe)
        env:
          ADMIN_VALUE: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: |
          set -e
          base=https://pulseworker-v2.quiquandon.workers.dev
          sleep 20
          curl -fsS "$base/research-lab" | grep -q '<title>CryptoPulse Research</title>'
          curl -fsS "$base/research-lab/advanced" | grep -q 'Research Lab'
          curl -fsS "$base/api/learning/market" > market.json
          python3 - <<'EOF'
          import json
          d = json.load(open('market.json'))
          assert d['ok'] and d['stage7_available'], d.get('error')
          print('events:', len(d['events']), '| latest BTC:', d['latest']['btc']['btc_price'], '| latest V1:', d['latest']['v1']['score'], '| focus event:', d['focus_event_id'])
          for e in d['events']:
              print(' ', e['event_id'], e['verdict'], e['explained_share'], '|', e['headline'][:80])
          EOF
          curl -fsS "$base/api/learning/versions" | grep -q '"available":true'
          curl -fsS "$base/api/learning/case?event_id=15" | grep -q '"research_pack"'
          # Authorization probe that cannot write: event 999999999 does not exist, so a valid token gets 409.
          code=$(curl -s -o probe.json -w '%{http_code}' -X POST "$base/api/learning/candidates" -H 'Content-Type: application/json' -H "Authorization: Bearer $ADMIN_VALUE" -d '{"event_id":999999999}')
          cat probe.json; echo
          [ "$code" = "409" ] || { echo "::error::admin token probe returned $code (expected 409)"; exit 1; }
          echo "production Research Lab is live at $base/research-lab"

  # PRODUCTION, manual only, from main (job=production-session-smoke): no-write smoke check of the signed device
  # session on pulseworker-v2. Signs in once in Chromium, then probes the save routes against a non-existent event
  # (authorized, then refused before any write) and checks learning-table state is identical before and after.
  # Never deploys, never sets secrets, never touches D1 directly. Guarded by tests/learning-loop.test.js.
  production-session-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'production-session-smoke' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: No-write production session smoke check
        env:
          PROD_ADMIN_TOKEN: ${{ secrets.STAGE7_STAGING_ADMIN_TOKEN }}
        run: node tests/e2e/production-session-smoke.cjs
