# Throwaway, read-only FRED HTTP 520 diagnosis from a GitHub-hosted runner. No secrets, no production Worker, no D1.
name: fred-diagnosis
on:
  push:
    branches: [claude/epic-planck-uyapsw-provider-probe]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe fredgraph.csv variants (exact adapter URL shape)
        run: |
          start=$(date -u -d '-420 days' +%F)
          U="https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS2&cosd=$start"
          echo "runner: $(curl -sS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(colo|loc)=' | tr '\n' ' ')"
          echo "DNS: $(getent ahosts fred.stlouisfed.org | awk '{print $1}' | sort -u | tr '\n' ' ')"
          v() {  # name, extra curl args
            local name="$1"; shift
            local out; out=$(curl -sS --max-time 25 -o body.txt -D hdr.txt -w '%{http_code} %{size_download} %{time_total} %{http_version}' "$@" "$U" 2>&1) || out="curl-error: $out"
            echo "VARIANT|$name|$out|server=$(grep -i '^server:' hdr.txt | tr -d '\r' | cut -d' ' -f2-)|cf-ray=$(grep -ci '^cf-ray:' hdr.txt)|via=$(grep -i '^via:' hdr.txt | tr -d '\r' | cut -c1-60)|ctype=$(grep -i '^content-type:' hdr.txt | tr -d '\r' | cut -d' ' -f2-)|lines=$(wc -l < body.txt)|head=$(head -c 60 body.txt | tr '\n' ' ')"
          }
          v curl_default_ua
          v no_user_agent -H 'User-Agent:'
          v no_ua_no_accept -H 'User-Agent:' -H 'Accept:'
          v workers_like_ua -A 'Mozilla/5.0 (compatible; Cloudflare-Workers)'
          v descriptive_ua -A 'CryptoPulse-EventDetection/ed-v1 (+https://github.com/quiquandon-oss/PulseWorkerV2)'
          v http1_no_ua --http1.1 -H 'User-Agent:'
          v browser_ua -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          echo "--- full headers (default UA)"; curl -sS --max-time 25 -D - -o /dev/null "$U" | tr -d '\r' | grep -viE '^(set-cookie|date):'
          echo "--- full headers (no UA)"; curl -sS --max-time 25 -D - -o /dev/null -H 'User-Agent:' "$U" | tr -d '\r' | grep -viE '^(set-cookie|date):' || true
          echo "--- repeat no-UA x3 (transient vs deterministic)"; for i in 1 2 3; do curl -sS --max-time 25 -o /dev/null -w "%{http_code}\n" -H 'User-Agent:' "$U"; sleep 2; done
          echo "--- keyed API host reachability (no key, expect 400 not 5xx)"; curl -sS --max-time 25 -o /dev/null -w "%{http_code}\n" "https://api.stlouisfed.org/fred/series/observations?series_id=DGS2&file_type=json"
