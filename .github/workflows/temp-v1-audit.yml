name: (temp) V1 Technical Score audit

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy scipy scikit-learn --break-system-packages --quiet
      - name: Run audit
        run: python3 v1-audit-temp/audit.py > v1-audit-temp/output.txt 2>&1 || echo "EXIT_CODE=$?" >> v1-audit-temp/output.txt
      - name: Commit output
        run: |
          git config user.name "v1-audit-bot"
          git config user.email "actions@github.com"
          git add v1-audit-temp/output.txt
          git commit -m "chore(temp): v1 technical audit output" || echo "nothing to commit"
          git push
