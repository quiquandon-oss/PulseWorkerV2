name: (temp) Exp4 runtime audit

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Live endpoint check
        run: |
          echo "=== /research/timesfm-recent?horizon=12 ===" > endpoint_output.txt
          curl -sS "https://pulseworker-v2.quiquandon.workers.dev/research/timesfm-recent?horizon=12&limit=5" >> endpoint_output.txt
          echo "" >> endpoint_output.txt
          echo "=== /research/timesfm-recent?horizon=24 ===" >> endpoint_output.txt
          curl -sS "https://pulseworker-v2.quiquandon.workers.dev/research/timesfm-recent?horizon=24&limit=5" >> endpoint_output.txt

      - name: Commit output
        run: |
          git config user.name "exp4-audit-bot"
          git config user.email "actions@github.com"
          mv endpoint_output.txt .ai/exp004-endpoint-output.txt
          git add .ai/exp004-endpoint-output.txt
          git commit -m "chore(temp): exp4 live endpoint check" || echo "nothing to commit"
          git push
