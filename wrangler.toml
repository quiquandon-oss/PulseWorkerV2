name = "pulseworker-v2"
main = "worker.js"
compatibility_date = "2024-11-01"
# Explicit account_id so wrangler skips its /memberships auto-detection call
# at deploy time (that call was failing with a 9106 "missing auth headers"
# error for this token/account regardless of permissions granted — this
# sidesteps it rather than depending on why). Account IDs aren't sensitive,
# safe to commit in plain text.
account_id = "f58e761fbc8e62dc404d8684290af264"

[ai]
binding = "AI"

# GIT_COMMIT_SHA is overridden at deploy time with the real commit SHA via
# `wrangler deploy --var GIT_COMMIT_SHA:$GITHUB_SHA` in deploy.yml. The
# static value here is only what local/manual deploys fall back to.
# MODEL_VERSIONS (per-model tags) live in worker.js itself, not here --
# see the MODEL_VERSIONS constant.
[vars]
GIT_COMMIT_SHA = "unknown"

# Deliberately the SAME database as the original PulseWorker (sentiment-ff75) —
# gives this Worker read access to the existing history/technical_eval tables
# (25+ days of real sentiment/technical/regime data) from day one, and a place
# to write new V2-only tables (predictions, calibration log) without touching
# anything the original app depends on. See CryptoPulseV2 README for context.
[[d1_databases]]
binding = "DB"
database_name = "sentiment-history"
database_id = "f91ca980-b886-423a-bd6f-f3baea46d181"

# 3h: predict-and-log (tightened from 6h — doubles data accumulation rate
# at every existing horizon, no new noise problem introduced, unlike adding
# a shorter prediction horizon would). Daily at 07:00 UTC: comprehensive
# Gemini analysis (arbitrary fixed hour, just needs to be consistent so
# "daily" means once a day rather than drifting).
[triggers]
crons = ["0 */3 * * *", "0 7 * * *"]

# Codifies what was already turned on directly via the dashboard
# (2026-09-05), so it doesn't silently get reset on the next deploy —
# Cloudflare's own dashboard shows a warning to that effect whenever the
# committed config doesn't match a dashboard-set observability config.
# Confirmed against Cloudflare's current docs (accessed same day) that
# this exact shape (enabled/head_sampling_rate/invocation_logs/persist
# nested under both `logs` and `traces` individually) is the current
# schema. Purely diagnostic/config -- available on Workers Free (unlike
# Tail Workers, which need Paid/Enterprise and are NOT what this is).
# Traces stay disabled, matching what's already set -- this only locks
# in Logs, which is what PR #34's LINK_* checkpoints need to actually
# persist anywhere queryable.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
