name: (temp) Exp4 runtime audit

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        run: npm install -g wrangler

      - name: Runtime audit queries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          OUT=audit_output.txt
          echo "=== now ===" > $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT datetime('now') as now_utc, CAST(strftime('%s','now') AS INTEGER)*1000 as now_ms" >> $OUT

          echo "=== EXP-004: all rows, full detail ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT id, coin, horizon_hours, ts, target_ts, input_end_ts, price_at_prediction, forecast_price, predicted_return_pct, direction, context_length, forecast_horizon_steps, actual_return_pct, actual_direction, correct, resolved_ts FROM experiment_4_timesfm ORDER BY id ASC" >> $OUT

          echo "=== EXP-004: count by coin (must be BTC only) ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, COUNT(*) as n FROM experiment_4_timesfm GROUP BY coin" >> $OUT

          echo "=== recent BTC cadence for target_ts sanity (last 30 raw timestamps) ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT DISTINCT ts FROM btc_data ORDER BY ts DESC LIMIT 30" >> $OUT

          echo "=== EXP-002 (anomaly gate): any non-BTC rows since restriction? ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, COUNT(*) as n, MAX(ts) as latest_ts FROM selection_decisions_anomaly GROUP BY coin" >> $OUT

          echo "=== EXP-003 (momentum): any non-BTC rows since restriction? ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT coin, COUNT(*) as n, MAX(ts) as latest_ts FROM selection_decisions_momentum GROUP BY coin" >> $OUT

          echo "=== production selection_decisions row count today (D1 write-volume sanity) ===" >> $OUT
          wrangler d1 execute sentiment-history --remote --command "SELECT COUNT(*) as n FROM selection_decisions WHERE ts > (CAST(strftime('%s','now') AS INTEGER)*1000 - 86400000)" >> $OUT

      - name: Commit output
        run: |
          git config user.name "exp4-audit-bot"
          git config user.email "actions@github.com"
          mv audit_output.txt .ai/exp004-runtime-audit-output.txt
          git add .ai/exp004-runtime-audit-output.txt
          git commit -m "chore(temp): exp4 runtime audit output" || echo "nothing to commit"
          git push
