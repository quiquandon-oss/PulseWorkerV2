name: Prediction staleness alert

# Three checks, reported once (ops/ALERTING.md):
#   predictions  the prediction pipeline has stalled or missed scheduled runs (/prediction-freshness)
#   workflows    a scheduled collection or evaluation workflow stopped running or keeps failing
#   usage        D1 rows read today are heading for the daily limit (/d1-usage); reaching it stalled
#                predictions on 2026-11-11
# De-duplication: findings are kept in one issue labelled `ops-alert`. The run is red only when an alert is new
# or its set of problems changed; while the same alert lasts the run is green and says so, and the issue is
# closed automatically on recovery. A check that cannot read its source counts as a finding.
# Read-only apart from that issue: GETs of two public Worker routes and a listing of workflow runs. No deploy.
# Started by the Worker's cron one hour after each prediction run, and by the schedule below as fallback.
on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Test only: run a fixed scenario against the label ops-alert-test (healthy, usage_warning, usage_critical, usage_stale, predictions_stale, fetch_failure). Empty = real checks.'
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  issues: write     # only to open, update and close the alert issue

concurrency:
  group: prediction-staleness-alert     # one writer to the alert issue at a time
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the checks and report once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SIMULATE: ${{ inputs.simulate }}
        run: |
          if [ -n "$SIMULATE" ]; then set -- --simulate "$SIMULATE"; else set --; fi
          python3 ops/alert_run.py "${{ github.repository }}" "$@" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
