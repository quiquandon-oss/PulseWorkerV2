name = "pulseworker-v2"
main = "worker.js"
compatibility_date = "2024-11-01"
# Explicit account_id so wrangler skips its /memberships auto-detection call
# at deploy time (that call was failing with a 9106 "missing auth headers"
# error for this token/account regardless of permissions granted — this
# sidesteps it rather than depending on why). Account IDs aren't sensitive,
# safe to commit in plain text.
account_id = "f58e761fbc8e62dc404d8684290af264"

[ai]
binding = "AI"

# GIT_COMMIT_SHA is overridden at deploy time with the real commit SHA via
# `wrangler deploy --var GIT_COMMIT_SHA:$GITHUB_SHA` in deploy.yml. The
# static value here is only what local/manual deploys fall back to.
# MODEL_VERSIONS (per-model tags) live in worker.js itself, not here --
# see the MODEL_VERSIONS constant.
[vars]
GIT_COMMIT_SHA = "unknown"
# Sentiment V2 (docs/SENTIMENT_V2_IMPLEMENTATION.md). "0" stops V2 cycles; V1 is unaffected either way.
SENTIMENT_V2_ENABLED = "1"
# Optional GLM annotation (scope lock 2026-11-14): Workers AI binding only, hard daily Neuron budget. It is OFF in
# production in two independent ways: the model id is EMPTY and the Neuron budget is "0" (worker.js sv2RunAi needs both a
# model and a non-zero budget). A later, separately approved change sets BOTH (the model "@cf/zai-org/glm-4.7-flash"
# and a small budget, e.g. "1000") only after a staging call has verified availability and real Neuron use on this
# account. The account's free 10,000 Neurons/day are shared with V1 (sentiment-ff75 uses Workers AI). It never sets a score.
SENTIMENT_V2_AI_MODEL = ""
SV2_GLM_DAILY_NEURONS = "0"
# Scheduled research stopped (owner decision 2026-11-17; worker.js scheduledResearchEnabled, 07:00 UTC cron):
# Gemini daily BTC/LINK narrative, EXP-002 anomaly gate, EXP-003 momentum overlay. "1" (or removing the line) resumes.
# Manual routes and all stored rows are unchanged.
GEMINI_DAILY_CRON_ENABLED = "0"
EXP002_CRON_ENABLED = "0"
EXP003_CRON_ENABLED = "0"
# Independent evidence collector (sentiment-v2/collector.js): "1" collects RSS/Atom/official feeds in the hourly
# non-tick cron, within SV2_COLLECTOR_LIMITS (3 sources, 8 subrequests, 768 KiB per run, the shared 50-query D1 budget)
# and behind the daily D1 stop (sv2CollectGuarded: 2.5M rows read / 50k written, fail-closed on missing, stale or
# disabled usage recording). Enabled 2026-11-15 after migration 0029 (applied) and staging verification (real feeds,
# deduplication, provenance, 429/redirect handling, the daily stop observed in the deployed staging Worker).
# "0" switches it off again. SV2_SOURCES_DISABLED = "id,id" switches individual registry sources off.
SV2_COLLECTOR_ENABLED = "1"
# Bitcoin Magazine's feed redirects to plain http://bitcoinmagazine.com/feed (refused: https only), seen on staging.
SV2_SOURCES_DISABLED = "bitcoinmagazine"
# Challenger pause switch (worker.js challengerEnabled; owner decision 2026-11-17). "0" stops new challenger predictions
# and the daily challenger calibration refresh and removes the 3 challenger variants from selection; pending rows still
# resolve and all history stays. Ships "1" (unchanged); set "0" only after the production selection check.
CHALLENGER_ENABLED = "1"
# V1 hourly server readings (sentiment-ff75 scomp-v1, server_composite_readings) as a second V2 input (worker.js
# sv2ServerV1Rows; owner decision 2026-11-16). Read-only: nothing is copied into research_sentiment_archive or `history`.
# Each V2 result records its input in family_json.v1_input (browser | server). "0" returns V2 to archive-only input.
SV2_V1_SERVER_INPUT = "1"
# Hourly copy of new V1 `history` readings into research_sentiment_archive before each V2 cycle (worker.js
# syncV1ArchiveFromHistory). "0" stops the copy; the GitHub live-evidence-collection job still archives as before.
V1_ARCHIVE_SYNC_ENABLED = "1"
# GLM evidence intelligence (docs/GLM_PHASE_B_CONTRACTS.md; glm/runner.js). 07:00 UTC daily, BTC 24 h only.
# PRODUCTION INFLUENCE ENABLED (owner mandate 2026-11-20). Kill switch / rollback, each a one-line change + deploy:
#   GLM_INFLUENCE_CAP = "0"      -> shadow: served p_up = baseline again (inference and ledger keep running)
#   GLM_INFERENCE_ENABLED = "0"  -> no model call; every run NO_SIGNAL, so nothing applies
#   GLM_TICK_HOOK_ENABLED = "0"  -> no per-tick read/write, no glm object on snapshots
# GLM_SIGNAL_ENABLED "1": build the bounded, provenance-tracked package and store a NO_SIGNAL/CANDIDATE/ELIGIBLE record daily.
# GLM_INFERENCE_ENABLED "1": one call of @cf/zai-org/glm-4.7-flash per day (GLM_MODEL defaults to it) through the shared
#   atomic sv2_ai_neurons ledger, capped by GLM_DAILY_NEURONS (one call reserves ~210 Neurons, <= 3% of the free 10,000).
#   Account is on Workers Free: beyond the allocation the call fails (3036) and nothing is billed; the run falls back.
#   SENTIMENT_V2_AI_MODEL / SV2_GLM_DAILY_NEURONS (per-cycle V2 annotation) stay off and are independent of this.
# GLM_TICK_HOOK_ENABLED "1": per BTC 24 h tick, baseline / would-apply / applied / final + explanation on the snapshot and
#   one glm_adjustments row (2-3 D1 calls per tick; other coins/horizons 0).
# GLM_INFLUENCE_CAP "0.03": PROVISIONAL, not validated. Only ELIGIBLE (2-day persistent, corroborated) UP/DOWN signals move
#   p_up, by 1/3, 2/3 or 1 x cap (weak/moderate/strong); hard max 0.10 in code. GLM_ALLOW_FLIP "0": the adjustment never
#   moves p_up across 0.5 (GLM cannot reverse the baseline call). The predictions table always keeps the baseline.
GLM_SIGNAL_ENABLED = "1"
GLM_INFERENCE_ENABLED = "1"
GLM_TICK_HOOK_ENABLED = "1"
GLM_INFLUENCE_CAP = "0.03"
GLM_ALLOW_FLIP = "0"
GLM_DAILY_NEURONS = "300"

# Deliberately the SAME database as the original PulseWorker (sentiment-ff75) —
# gives this Worker read access to the existing history/technical_eval tables
# (25+ days of real sentiment/technical/regime data) from day one, and a place
# to write new V2-only tables (predictions, calibration log) without touching
# anything the original app depends on. See CryptoPulseV2 README for context.
# EXP-023 paused (owner decision 2026-11-17): no hourly dispatch of the EXP-023 intraday funding collector
# (worker.js researchFundingDispatchEnabled). The staleness-alert dispatch is unaffected. "1" resumes.
RESEARCH_FUNDING_DISPATCH_ENABLED = "0"

[[d1_databases]]
binding = "DB"
database_name = "sentiment-history"
database_id = "f91ca980-b886-423a-bd6f-f3baea46d181"

# 2 total Cron Triggers for this Worker, fitting the account's real
# Workers Free budget (2026-09-05): capped at 5 Cron Triggers per
# ACCOUNT (not per Worker); V1 (sentiment-ff75) already uses 3 of those
# 5, leaving exactly 2 for this Worker. One shared 3h trigger runs
# BTC+LINK+ETH production (predictions, Challenger, selection) --
# unrestricted, all three coins, same as before PR #30 introduced
# per-coin batching within this one invocation. The daily 07:00 trigger
# runs Gemini analyses, calibration refreshes, and Experiments 2/3 --
# the experiments are restricted to BTC only in code (see worker.js's
# EXPERIMENT_2_COINS / MOMENTUM_EXPERIMENT_COINS), not by cron
# structure, since research-only load reduction doesn't need a
# dedicated trigger. See worker.js's runCoinCronTick comment for the
# full history of why a 4-trigger, fully-isolated-per-coin design was
# attempted and reverted the same day.
[triggers]
crons = ["0 * * * *", "0 7 * * *"]   # hourly: production tick at hours divisible by 3, Event Detection otherwise (worker.js scheduled())

# Codifies what was already turned on directly via the dashboard
# (2026-09-05), so it doesn't silently get reset on the next deploy —
# Cloudflare's own dashboard shows a warning to that effect whenever the
# committed config doesn't match a dashboard-set observability config.
# Confirmed against Cloudflare's current docs (accessed same day) that
# this exact shape (enabled/head_sampling_rate/invocation_logs/persist
# nested under both `logs` and `traces` individually) is the current
# schema. Purely diagnostic/config -- available on Workers Free (unlike
# Tail Workers, which need Paid/Enterprise and are NOT what this is).
# Traces stay disabled, matching what's already set -- this only locks
# in Logs, which is what PR #34's LINK_* checkpoints need to actually
# persist anywhere queryable.
[observability.logs]
# Logs are diagnostic only; audit records live in D1. 2026-11 volume reduction (Phase 0 closure §3.1):
# no per-request invocation logs, 10 % head sampling, payloads capped at 512 bytes (observability/bounded-log.js).
enabled = true
head_sampling_rate = 0.1
invocation_logs = false
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
