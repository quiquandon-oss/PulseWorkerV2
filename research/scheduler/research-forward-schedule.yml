# RESEARCH ONLY -- Risk Regime forward collection: DAILY SCHEDULE (10:40 UTC).
#
# NOT INSTALLED. This file is inert where it is (outside .github/workflows). GitHub runs `schedule` triggers only
# from workflow files on the repository's DEFAULT branch, so enabling the authorised daily collection requires
# placing exactly this one file at .github/workflows/research-forward-schedule.yml on `main`. That is a write to
# main and needs its own explicit approval. Nothing else from the research branch goes to main: the code is
# checked out at the pinned commit below, read-only.
#
# Isolation (verified in research/test_research_workflow_isolation.py and RISK_REGIME_FORWARD.md section 6):
# - trigger: schedule only (no push, no pull_request, no dispatch, no workflow_run) -> a push cannot start it;
# - permissions: contents: write only; no secrets referenced; GITHUB_TOKEN pushes never start other workflows;
# - writes: only refs/heads/research-data/risk-regime-forward, only paths under risk_regime_forward/;
# - deploy.yml runs only on pushes to main touching worker.js / wrangler.toml / package*.json / deploy.yml.
#   This file matches none of them, and the job never pushes to main.
name: research-forward-schedule

on:
  schedule:
    - cron: '40 10 * * *'      # daily 10:40 UTC (authorised cadence)

permissions:
  contents: write          # only to push to research-data/risk-regime-forward; no actions/deployments/id-token/packages
                           # (no `actions` permission: this token cannot dispatch or re-run workflows)

concurrency:
  group: research-forward-collection     # shared with the other trigger: never two writers at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Check out the research code (read-only: no credentials kept)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: RESEARCH_CODE_SHA   # pinned research commit; replaced with the reviewed SHA at installation
          path: code
          persist-credentials: false

      - name: "Check out the research-data branch (the only write target)"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          ref: research-data/risk-regime-forward
          path: data
          fetch-depth: 0
          persist-credentials: false        # the collector step runs with no credentials on disk

      - name: "Collect (idempotent; NOT_YET_PUBLISHED / MISSING / gaps / conflicts recorded, never filled)"
        run: python3 code/research/risk_regime_forward.py --store data/risk_regime_forward --max-days 60

      - name: "Commit run record and new partitions to the research-data branch only"
        if: always()
        working-directory: data
        env:
          TARGET: research-data/risk-regime-forward
          PUSH_TOKEN: ${{ github.token }}   # only this step sees the token; it can push only the fixed refspec below
        run: |
          set -euo pipefail
          [ "$(git rev-parse --abbrev-ref HEAD)" = "$TARGET" ] || { echo "::error::data checkout is not $TARGET"; exit 1; }
          git config user.name "research-forward-collection[bot]"
          git config user.email "research-forward-collection@users.noreply.github.com"
          git add -A risk_regime_forward
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          outside=$(git diff --cached --name-only | grep -v '^risk_regime_forward/' || true)
          if [ -n "$outside" ]; then echo "::error::refusing to commit outside risk_regime_forward/: $outside"; exit 1; fi
          git commit -m "Research data: forward collection run ${GITHUB_RUN_ID} (${GITHUB_EVENT_NAME})"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4; do
            git push "$remote" "HEAD:refs/heads/${TARGET}" && exit 0
            sleep $((2**i)); git pull --rebase "$remote" "$TARGET"
          done
          exit 1
