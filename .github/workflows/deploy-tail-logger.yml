name: Deploy Tail Logger
on:
  push:
    branches: [main]
    paths:
      - 'tail-logger/**'
      - '.github/workflows/deploy-tail-logger.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: tail-logger
          command: deploy
