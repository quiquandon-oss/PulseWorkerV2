name: Experiment 5 - V1 Source Effectiveness Research (research only)

# EXP-005: V1 Source / Coefficient Research. Runs research/source_analysis.py's
# own build_source_effectiveness_report() -- UNCHANGED, reused not
# reimplemented -- against real, bounded (<=90 days) production data, and
# persists the full report into the EXISTING research_analyses table
# (schema unchanged since PR1), tagged subject='EXP-005:source_effectiveness'.
#
# Weekly, not daily: unlike Experiment 4's daily forecast/resolve cycle,
# a meaningfully NEW chronological window for this kind of analysis needs
# real time to pass -- re-running against a near-identical 90-day window
# a day later would not produce independent evidence, only noise. Weekly
# shifts the window by ~7 of 90 days (~7.8% new data) between runs, which
# is the smallest cadence that still produces a genuinely different
# window without over-claiming independence between consecutive runs
# (see the registry's own required_sample discussion -- accumulated runs
# are correlated, overlapping windows, not independent trials).
#
# $0: GitHub Actions `schedule:` only -- does NOT add a new Cloudflare
# Cron Trigger (same reasoning as live-evidence-collection.yml and
# exp004-timesfm.yml; the account's 5-Cron-Trigger budget is already
# fully committed, see wrangler.toml's own comment).
#
# Writes ONLY research_analyses (INSERT only, never UPDATE/DELETE). No
# V1/V2/Worker file is touched. No migration (research_analyses already
# exists). No production prediction/selection/coefficient logic is
# read, written, or influenced by this workflow in any way.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

concurrency:
  group: exp005-source-effectiveness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest --break-system-packages

      - name: Run research/ tests (never run this pipeline against production on red tests)
        run: python3 -m pytest research/ exp005-source-effectiveness/ -v

      - name: Run source-effectiveness analysis
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 exp005-source-effectiveness/run_experiment.py
